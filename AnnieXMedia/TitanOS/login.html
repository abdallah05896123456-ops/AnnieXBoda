<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan OS | Login</title>
    <!-- خطوط آبل والخطوط الحديثة -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(22, 22, 22, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --accent: #ffffff; /* Apple Style White Button */
            --danger: #ff453a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* خلفية ضبابية متحركة لإظهار تأثير الزجاج */
        .ambient-light {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(circle at 15% 50%, rgba(50, 50, 50, 0.4), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(30, 30, 35, 0.4), transparent 40%);
            animation: pulseLight 10s ease-in-out infinite alternate;
        }

        @keyframes pulseLight {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        /* الكارت الزجاجي (Apple Style) */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 360px;
            padding: 40px 30px;
            background: var(--glass-bg);
            /* تأثير التغبيش القوي */
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* الهيدر */
        .logo-text {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
            background: linear-gradient(to bottom, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sub-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* الحقول */
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        .ios-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid transparent;
            padding: 16px;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s all;
        }

        .ios-input::placeholder { color: var(--text-secondary); }

        .ios-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        /* الأزرار */
        .btn-primary {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.15);
        }

        .btn-primary:active { transform: scale(0.96); }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            margin-top: 15px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-secondary:hover { color: #fff; }

        /* رسائل الحالة */
        .status-msg {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            min-height: 20px;
            opacity: 0.8;
        }

        /* التحويل بين الشاشات */
        .view-section { display: none; animation: fadeUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .view-section.active { display: block; }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* أيقونة القفل المتحركة */
        .lock-icon-container {
            margin-bottom: 20px;
            font-size: 2.5rem;
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <!-- الخلفية الضبابية -->
    <div class="ambient-light"></div>

    <div class="glass-card" id="mainCard">
        
        <!-- أيقونة القفل بدلاً من البصمة -->
        <div class="lock-icon-container">
            <i class="fa-solid fa-lock"></i>
        </div>

        <div class="logo-text">Titan OS</div>
        <p class="sub-text">Welcome back, Administrator.</p>

        <!-- 1. شاشة الباسورد -->
        <div id="view-password" class="view-section active">
            <form onsubmit="event.preventDefault(); handlePasswordLogin();">
                <div class="input-group">
                    <input type="text" id="username" class="ios-input" placeholder="Username" autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" id="password" class="ios-input" placeholder="Password">
                </div>
                <button type="submit" id="pwdBtn" class="btn-primary">Sign In</button>
            </form>
        </div>

        <!-- 2. شاشة البصمة (بدون أيقونة كبيرة) -->
        <div id="view-biometric" class="view-section">
            <div style="margin: 20px 0;">
                <i class="fa-solid fa-face-viewfinder" style="font-size: 2rem; color: #fff; opacity: 0.8;"></i>
            </div>
            <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 20px;">Use FaceID or TouchID to enter.</p>
            <button onclick="verifyBiometric()" class="btn-primary">Authenticate</button>
            <button onclick="switchView('password')" class="btn-secondary">Use Password</button>
        </div>

        <!-- 3. شاشة التفعيل -->
        <div id="view-enroll" class="view-section">
            <p style="color: #fff; margin-bottom: 15px;">Enable Biometrics for faster access?</p>
            <button onclick="enrollBiometric()" class="btn-primary">Enable</button>
            <button onclick="skipEnrollment()" class="btn-secondary">Skip</button>
        </div>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        // --- إعدادات النظام ---
        const USER_ID = "titan_admin_id";
        const USER_NAME = "TitanAdmin";
        const isBiometricAvailable = window.PublicKeyCredential;
        const isEnrolled = localStorage.getItem('titan_bio_credentialId');

        window.onload = () => {
            if (isBiometricAvailable && isEnrolled) {
                switchView('biometric');
                // محاولة التحقق التلقائي السريع
                // verifyBiometric(); 
            }
        };

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            setStatus("");
        }

        function setStatus(msg, isError = false) {
            const el = document.getElementById('statusMsg');
            el.innerText = msg;
            el.style.color = isError ? "var(--danger)" : "var(--text-secondary)";
            if(isError) {
                // هز الكارت عند الخطأ
                const card = document.getElementById('mainCard');
                card.style.transform = "translateX(10px)";
                setTimeout(() => card.style.transform = "translateX(-10px)", 100);
                setTimeout(() => card.style.transform = "translateX(0)", 200);
            }
        }

        // --- 1. تسجيل الدخول بالباسورد ---
        async function handlePasswordLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const btn = document.getElementById('pwdBtn');

            if (!u || !p) {
                setStatus("Please fill in all fields", true);
                return;
            }

            setStatus("Verifying...");
            btn.style.opacity = "0.7";

            try {
                const formData = new FormData();
                formData.append('username', u);
                formData.append('password', p);

                const res = await fetch('/login', { method: 'POST', body: formData });
                const data = await res.json(); // نتوقع JSON من السيرفر المعدل

                if (res.ok && (data.status === 'success' || res.redirected)) {
                    // إذا نجح الدخول
                    if (isBiometricAvailable && !isEnrolled) {
                        switchView('enroll');
                    } else {
                        grantAccess();
                    }
                } else {
                    throw new Error("Invalid");
                }
            } catch (e) {
                // في حالة أن السيرفر يعيد Redirect مباشرة بدل JSON
                // سنتعامل مع الخطأ، لكن لو السيرفر يعمل Redirect سيعمل المتصفح تلقائياً
                setStatus("Incorrect password", true);
                btn.style.opacity = "1";
            }
        }

        // --- 2. تفعيل البصمة ---
        async function enrollBiometric() {
            setStatus("Scan your fingerprint/face now...");
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);

            const publicKey = {
                challenge: challenge,
                rp: { name: "Titan OS", id: window.location.hostname },
                user: {
                    id: Uint8Array.from(USER_ID, c => c.charCodeAt(0)),
                    name: USER_NAME,
                    displayName: "Admin"
                },
                pubKeyCredParams: [{alg: -7, type: "public-key"}, {alg: -257, type: "public-key"}],
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                timeout: 60000
            };

            try {
                await navigator.credentials.create({ publicKey });
                localStorage.setItem('titan_bio_credentialId', 'true');
                setStatus("Setup Complete!");
                setTimeout(grantAccess, 1000);
            } catch (e) {
                setStatus("Setup Skipped", true);
                setTimeout(grantAccess, 1000);
            }
        }

        function skipEnrollment() { grantAccess(); }

        // --- 3. التحقق بالبصمة ---
        async function verifyBiometric() {
            setStatus("Authenticating...");
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);

            try {
                await navigator.credentials.get({
                    publicKey: { challenge: challenge, rpId: window.location.hostname, userVerification: "required" }
                });
                
                // بصمة صحيحة -> تسجيل دخول تلقائي
                const formData = new FormData();
                formData.append('username', 'Abdallah'); 
                formData.append('password', 'asdfghjkl05896');
                await fetch('/login', { method: 'POST', body: formData });
                grantAccess();

            } catch (e) {
                setStatus("Try Password", true);
            }
        }

        function grantAccess() {
            const card = document.getElementById('mainCard');
            card.style.transform = "scale(0.95)";
            card.style.opacity = "0";
            setTimeout(() => window.location.href = '/', 500);
        }
    </script>
</body>
</html>
