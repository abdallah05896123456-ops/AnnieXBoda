<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 
        TITAN OS | SMART ACCESS v6.0 (Optimized)
        Performance: High FPS | Logic: Manual Trigger
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan OS | Secure Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* [OPTIMIZED CSS] Reduced blur & shadows for better performance */
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 25, 0.85); /* Less transparency = Less GPU usage */
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #ffffff;
            --accent: #00ff88;
            --error: #ff3333;
            --input-bg: rgba(0, 0, 0, 0.5);
            --font-main: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            color: var(--primary);
            overflow: hidden;
        }

        /* [PERFORMANCE] Reduced Star Count & Simple Animations */
        #space-layer { position: fixed; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .star {
            position: absolute; background: white; border-radius: 50%; opacity: 0.3;
            animation: twinkle 4s infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }

        /* Main Card */
        .titan-card {
            position: relative; z-index: 10;
            width: 380px; padding: 35px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            /* Reduced Blur for FPS */
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .brand-icon { font-size: 3rem; margin-bottom: 15px; color: var(--primary); }
        .title { font-size: 1.4rem; font-weight: 600; margin-bottom: 5px; }
        .subtitle { font-size: 0.8rem; color: #888; margin-bottom: 25px; }

        /* Inputs */
        .input-group { position: relative; width: 100%; margin-bottom: 15px; }
        
        .titan-input {
            width: 100%; padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: #fff; font-size: 0.95rem;
            transition: border 0.3s;
        }
        .titan-input:focus { border-color: rgba(255,255,255,0.4); }

        /* Eye Icon */
        .toggle-pass {
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%);
            color: #888; cursor: pointer; padding: 5px;
        }
        .toggle-pass:hover { color: #fff; }

        /* Buttons */
        .action-btn {
            width: 100%; padding: 14px;
            background: var(--primary); color: #000;
            border: none; border-radius: 10px;
            font-weight: 600; cursor: pointer;
            margin-top: 10px; transition: 0.2s;
        }
        .action-btn:active { transform: scale(0.98); }

        .link-btn {
            background: none; border: none;
            color: #888; font-size: 0.85rem;
            margin-top: 15px; cursor: pointer;
            text-decoration: underline;
        }
        .link-btn:hover { color: #fff; }

        .bio-btn {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent);
            border: 1px solid rgba(0, 255, 136, 0.2);
            margin-top: 15px; display: none; /* Hidden by default */
        }
        .bio-btn.visible { display: block; }

        /* Sections */
        .view-section { display: none; animation: fadeIn 0.4s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Biometric Scanner UI */
        .bio-scanner {
            width: 70px; height: 70px; margin: 20px auto;
            border-radius: 50%; border: 2px solid #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #555; cursor: pointer;
            transition: 0.3s;
        }
        .bio-scanner.active { border-color: var(--accent); color: var(--accent); }
        .bio-scanner.scanning { animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }

        .status-msg { margin-top: 15px; font-size: 0.8rem; min-height: 20px; }
        .status-msg.error { color: var(--error); }
        .status-msg.success { color: var(--accent); }

    </style>
</head>
<body>

    <div id="space-layer"></div>

    <div class="titan-card">
        <i class="fa-solid fa-shield-halved brand-icon"></i>
        <div class="title">Titan OS</div>
        <div class="subtitle" id="page-subtitle">Secure Kernel Access</div>

        <!-- VIEW 1: LOGIN (Username/Password) -->
        <div id="view-login" class="view-section active">
            <form onsubmit="event.preventDefault(); Auth.login();">
                <div class="input-group">
                    <input type="text" id="username" class="titan-input" placeholder="Username" required>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" class="titan-input" placeholder="Password" required>
                    <i class="fa fa-eye toggle-pass" onclick="UI.togglePass()"></i>
                </div>

                <button type="submit" id="btn-login" class="action-btn">Login</button>
            </form>

            <!-- Optional Biometric Button (Only shows if enrolled) -->
            <button id="trigger-bio" class="action-btn bio-btn" onclick="View.switch('bio')">
                <i class="fa-solid fa-fingerprint"></i> Use Fingerprint
            </button>

            <button class="link-btn" onclick="View.switch('forgot')">Forgot Password?</button>
        </div>

        <!-- VIEW 2: BIOMETRIC SCAN (Manual Trigger) -->
        <div id="view-bio" class="view-section">
            <p>Touch sensor to verify</p>
            <div class="bio-scanner" id="bio-sensor" onclick="Auth.scanBio()">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <button class="link-btn" onclick="View.switch('login')">Cancel</button>
        </div>

        <!-- VIEW 3: 2FA / FORGOT PASSWORD -->
        <div id="view-2fa" class="view-section">
            <p style="margin-bottom: 15px; color: #ccc; font-size: 0.9rem;">
                Open Google Authenticator and enter your code.
            </p>
            <div class="input-group">
                <input type="text" id="otp-code" class="titan-input" placeholder="000 000" style="text-align: center; letter-spacing: 5px; font-size: 1.2rem;" maxlength="6">
            </div>
            <button onclick="Auth.verify2FA()" id="btn-2fa" class="action-btn">Verify Identity</button>
            <button class="link-btn" onclick="View.switch('login')">Back to Login</button>
        </div>

        <!-- VIEW 4: ENROLLMENT (First Time Bio) -->
        <div id="view-enroll" class="view-section">
            <p>Trust this device for faster login?</p>
            <button onclick="Auth.enroll()" class="action-btn" style="background: var(--accent); color: #000; margin-top: 20px;">
                Enable Biometrics
            </button>
            <button class="link-btn" onclick="Auth.finish()">Skip</button>
        </div>

        <div id="status-display" class="status-msg"></div>
    </div>

    <script>
        // CONFIGURATION
        const CONFIG = {
            storageKey: 'titan_bio_token_v2',
            api: {
                login: '/auth/step1',
                otp: '/auth/verify-2fa',
                bio: '/auth/biometric/verify',
                enroll: '/auth/biometric/enroll'
            }
        };

        // UI MANAGER
        const UI = {
            status: (msg, type) => {
                const el = document.getElementById('status-display');
                el.innerText = msg;
                el.className = `status-msg ${type}`;
            },
            
            toggleLoading: (btnId, active) => {
                const btn = document.getElementById(btnId);
                if(!btn) return;
                if(active) {
                    btn.dataset.txt = btn.innerText;
                    btn.innerText = "...";
                    btn.disabled = true;
                } else {
                    btn.innerText = btn.dataset.txt || "Submit";
                    btn.disabled = false;
                }
            },

            togglePass: () => {
                const input = document.getElementById('password');
                const icon = document.querySelector('.toggle-pass');
                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    input.type = "password";
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            }
        };

        // VIEW CONTROLLER
        const View = {
            switch: (viewName) => {
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                UI.status('', ''); // Clear errors
                
                if (viewName === 'forgot') viewName = '2fa'; // Forgot pass -> goes to 2FA

                const target = document.getElementById(`view-${viewName}`);
                if (target) target.classList.add('active');

                // Update subtitle
                const subtitles = {
                    'login': 'Secure Kernel Access',
                    'bio': 'Biometric Verification',
                    '2fa': 'Identity Verification',
                    'enroll': 'Device Trust Setup'
                };
                document.getElementById('page-subtitle').innerText = subtitles[viewName] || 'Security';
            }
        };

        // AUTH LOGIC
        const Auth = {
            init: () => {
                // Generate light background stars (Performance Optimized)
                const space = document.getElementById('space-layer');
                for(let i=0; i<40; i++) {
                    let s = document.createElement('div');
                    s.className = 'star';
                    s.style.left = Math.random()*100 + '%';
                    s.style.top = Math.random()*100 + '%';
                    s.style.width = Math.random()*2 + 'px';
                    s.style.height = s.style.width;
                    space.appendChild(s);
                }

                // Check if user has biometrics enrolled
                if (localStorage.getItem(CONFIG.storageKey)) {
                    document.getElementById('trigger-bio').classList.add('visible');
                }
            },

            // 1. Username/Pass Login
            login: async () => {
                const user = document.getElementById('username').value;
                const pass = document.getElementById('password').value;
                
                if(!user || !pass) return UI.status("Fill all fields", "error");
                UI.toggleLoading('btn-login', true);

                try {
                    // Send to Python Backend
                    const req = await fetch(CONFIG.api.login, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: user, password: pass })
                    });
                    const res = await req.json();

                    if (res.status === 'success') {
                        // Check if we need to set up biometrics
                        if (!localStorage.getItem(CONFIG.storageKey)) {
                            View.switch('enroll');
                        } else {
                            Auth.finish();
                        }
                    } else {
                        throw new Error(res.msg || "Invalid Credentials");
                    }
                } catch (e) {
                    UI.status(e.message, "error");
                } finally {
                    UI.toggleLoading('btn-login', false);
                }
            },

            // 2. Biometric Scan (Manual)
            scanBio: async () => {
                const scanner = document.getElementById('bio-sensor');
                scanner.classList.add('active', 'scanning');
                UI.status("Scanning...", "");

                try {
                    // Simulated Delay + Backend Check
                    await new Promise(r => setTimeout(r, 1500));
                    
                    const req = await fetch(CONFIG.api.bio, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: localStorage.getItem(CONFIG.storageKey) })
                    });
                    const res = await req.json();

                    if (res.status === 'success') {
                        UI.status("Verified.", "success");
                        Auth.finish();
                    } else {
                        throw new Error("Scan Failed");
                    }
                } catch (e) {
                    scanner.classList.remove('active', 'scanning');
                    UI.status("Not recognized. Try Password.", "error");
                    setTimeout(() => View.switch('login'), 1500);
                }
            },

            // 3. Verify OTP (Forgot Password / 2FA)
            verify2FA: async () => {
                const code = document.getElementById('otp-code').value;
                if(code.length < 6) return UI.status("Invalid Code", "error");
                
                UI.toggleLoading('btn-2fa', true);
                
                try {
                    const req = await fetch(CONFIG.api.otp, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code })
                    });
                    const res = await req.json();

                    if(res.status === 'success') {
                        Auth.finish();
                    } else {
                        throw new Error("Invalid Auth Code");
                    }
                } catch(e) {
                    UI.status(e.message, "error");
                } finally {
                    UI.toggleLoading('btn-2fa', false);
                }
            },

            // 4. Enroll New Device
            enroll: async () => {
                try {
                    // Create a fake token
                    const token = "TBIO_" + Date.now();
                    localStorage.setItem(CONFIG.storageKey, token);
                    
                    await fetch(CONFIG.api.enroll, { method: 'POST' }); // Tell server
                    Auth.finish();
                } catch(e) {
                    Auth.finish();
                }
            },

            // Final Redirect
            finish: () => {
                UI.status("Access Granted", "success");
                setTimeout(() => window.location.href = "/", 500);
            }
        };

        // Start
        window.onload = Auth.init;
    </script>
</body>
</html>
