<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN OS | BIOMETRIC ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ------------------------------------------------------------------
           TITAN OS VISUAL LANGUAGE (4K READY)
           ------------------------------------------------------------------ */
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --glass: rgba(10, 10, 12, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --bg-dark: #050505;
        }

        * { box-sizing: border-box; outline: none; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
        }

        /* BACKGROUND FX */
        .cyber-grid {
            position: absolute; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }
        @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); } 100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); } }

        /* CARD STYLE */
        .access-card {
            position: relative; z-index: 10; width: 400px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            text-align: center;
            transition: all 0.4s ease;
        }

        .logo-area { font-size: 3.5rem; margin-bottom: 10px; color: white; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .welcome-title { font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 30px; color: var(--neon-blue); }

        /* VIEWS (SWITCHING BETWEEN PASSWORD & BIO) */
        .view-section { display: none; animation: fadeIn 0.5s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* INPUTS */
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .titan-input {
            width: 100%; background: rgba(0,0,0,0.5);
            border: 1px solid #333; border-radius: 8px;
            padding: 15px 15px 15px 45px; color: #fff;
            font-family: 'Rajdhani', sans-serif; font-size: 1.1rem;
            transition: 0.3s;
        }
        .titan-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; transition: 0.3s; }
        .titan-input:focus + .input-icon { color: var(--neon-blue); }

        /* BUTTONS */
        .main-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(90deg, var(--neon-blue), #00a8ff);
            border: none; border-radius: 8px;
            color: #000; font-weight: 700; font-size: 1.1rem;
            cursor: pointer; margin-top: 10px;
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s;
        }
        .main-btn:hover { box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); transform: translateY(-2px); }
        
        .secondary-btn {
            background: transparent; border: 1px solid #444; color: #aaa; margin-top: 15px;
        }
        .secondary-btn:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.05); }

        /* BIO ANIMATION */
        .bio-scanner {
            width: 80px; height: 80px; margin: 0 auto 20px;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .bio-ring {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid var(--neon-blue); opacity: 0;
            animation: ripple 2s infinite;
        }
        .bio-ring:nth-child(2) { animation-delay: 0.5s; }
        @keyframes ripple { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        
        .finger-icon { font-size: 3rem; color: var(--neon-blue); z-index: 2; cursor: pointer; transition: 0.3s; }
        .finger-icon:hover { transform: scale(1.1); text-shadow: 0 0 20px var(--neon-blue); }

        .error-shake { animation: shake 0.4s ease-in-out; border-color: #ff3333 !important; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }
        
        .status-text { margin-top: 15px; font-size: 0.9rem; color: #666; min-height: 20px; }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="access-card">
        <div class="logo-area"><i class="fa-solid fa-fingerprint"></i></div>
        
        <!-- VIEW 1: PASSWORD LOGIN -->
        <div id="view-password" class="view-section active">
            <h2 class="welcome-title">SYSTEM LOGIN</h2>
            <form onsubmit="event.preventDefault(); handlePasswordLogin();">
                <div class="input-group">
                    <input type="text" id="username" class="titan-input" placeholder="USERNAME" autocomplete="off">
                    <i class="fa-solid fa-user input-icon"></i>
                </div>
                <div class="input-group">
                    <input type="password" id="password" class="titan-input" placeholder="PASSWORD">
                    <i class="fa-solid fa-lock input-icon"></i>
                </div>
                <button type="submit" id="pwdBtn" class="main-btn">AUTHENTICATE</button>
            </form>
        </div>

        <!-- VIEW 2: BIOMETRIC LOGIN (Auto-Shown if Enrolled) -->
        <div id="view-biometric" class="view-section">
            <h2 class="welcome-title">BIOMETRIC ACCESS</h2>
            <div class="bio-scanner" onclick="verifyBiometric()">
                <div class="bio-ring"></div>
                <div class="bio-ring"></div>
                <i class="fa-solid fa-fingerprint finger-icon"></i>
            </div>
            <p style="color:#aaa; font-size:0.9rem; margin-bottom:20px;">Touch sensor to verify identity</p>
            
            <button onclick="verifyBiometric()" class="main-btn">SCAN NOW</button>
            <button onclick="switchView('password')" class="main-btn secondary-btn">USE PASSWORD</button>
        </div>

        <!-- VIEW 3: ENROLLMENT (First Time) -->
        <div id="view-enroll" class="view-section">
            <h2 class="welcome-title" style="color:#fff">ENABLE BIOMETRICS?</h2>
            <p style="color:#888; margin-bottom:20px;">Secure your access with Fingerprint or FaceID for faster login next time.</p>
            <button onclick="enrollBiometric()" class="main-btn">YES, SECURE NOW <i class="fa-solid fa-shield-halved"></i></button>
            <button onclick="skipEnrollment()" class="main-btn secondary-btn">SKIP FOR NOW</button>
        </div>

        <div id="statusMsg" class="status-text">Ready.</div>
    </div>

    <script>
        // --- CONFIG ---
        // في الوضع الحقيقي، هذه البيانات تأتي من السيرفر، هنا سنحاكيها للمتصفح
        const USER_ID = "titan_admin_id"; // ID ثابت للمستخدم
        const USER_NAME = "TitanAdmin";
        
        // هل الجهاز يدعم البصمة؟ وهل المستخدم مسجل؟
        const isBiometricAvailable = window.PublicKeyCredential;
        const isEnrolled = localStorage.getItem('titan_bio_credentialId');

        // --- INIT ---
        window.onload = () => {
            if (isBiometricAvailable && isEnrolled) {
                switchView('biometric');
                setStatus("Biometric profile detected.", "#00ff88");
            } else {
                switchView('password');
            }
        };

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
        }

        function setStatus(msg, color="#666") {
            const el = document.getElementById('statusMsg');
            el.innerText = msg;
            el.style.color = color;
        }

        // --- 1. PASSWORD LOGIN ---
        async function handlePasswordLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const btn = document.getElementById('pwdBtn');

            if (!u || !p) {
                document.getElementById('username').classList.add('error-shake');
                document.getElementById('password').classList.add('error-shake');
                setTimeout(()=> document.querySelectorAll('.titan-input').forEach(i=>i.classList.remove('error-shake')), 500);
                return;
            }

            setStatus("Verifying credentials...", "var(--neon-blue)");
            btn.disabled = true;

            try {
                // إرسال البيانات للبايثون
                const formData = new FormData();
                formData.append('username', u);
                formData.append('password', p);

                const res = await fetch('/login', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    // نجاح الدخول!
                    // الآن نتحقق: هل نفعل البصمة؟
                    if (isBiometricAvailable && !isEnrolled) {
                        switchView('enroll');
                    } else {
                        grantAccess();
                    }
                } else {
                    throw new Error("Invalid Credentials");
                }
            } catch (e) {
                setStatus("Access Denied: Invalid Password", "#ff3333");
                btn.disabled = false;
            }
        }

        // --- 2. BIOMETRIC ENROLLMENT (تسجيل البصمة لأول مرة) ---
        async function enrollBiometric() {
            setStatus("Waiting for sensor...", "var(--neon-blue)");
            
            // تحدي عشوائي (في الوضع المثالي يأتي من السيرفر)
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);

            const publicKey = {
                challenge: challenge,
                rp: { name: "Titan OS", id: window.location.hostname },
                user: {
                    id: Uint8Array.from(USER_ID, c => c.charCodeAt(0)),
                    name: USER_NAME,
                    displayName: "System Administrator"
                },
                pubKeyCredParams: [{alg: -7, type: "public-key"}, {alg: -257, type: "public-key"}],
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                timeout: 60000
            };

            try {
                const credential = await navigator.credentials.create({ publicKey });
                
                // حفظ الـ Credential ID محلياً (محاكاة لقاعدة البيانات)
                // ملاحظة: لا يمكننا حفظ البصمة نفسها، نحفظ فقط "الإذن"
                localStorage.setItem('titan_bio_credentialId', 'true'); // Flag simple
                
                setStatus("Biometric Enrolled Successfully!", "#00ff88");
                setTimeout(grantAccess, 1000);
            } catch (e) {
                console.error(e);
                setStatus("Enrollment Failed or Cancelled", "#ff3333");
                setTimeout(grantAccess, 1500); // إدخاله بأي حال لأنه كتب الباسورد صح
            }
        }

        function skipEnrollment() {
            grantAccess();
        }

        // --- 3. BIOMETRIC VERIFICATION (الدخول بالبصمة) ---
        async function verifyBiometric() {
            setStatus("Touch ID / Face ID required...", "var(--neon-blue)");
            
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);

            try {
                const assertion = await navigator.credentials.get({
                    publicKey: {
                        challenge: challenge,
                        rpId: window.location.hostname,
                        userVerification: "required"
                    }
                });

                // إذا وصلنا هنا، يعني المتصفح تأكد من البصمة
                // في التطبيق الحقيقي، نرسل التوكين للسيرفر، هنا سنقوم بمحاكاة الدخول
                performAutoLogin();

            } catch (e) {
                console.error(e);
                setStatus("Biometric Mismatch. Try Password.", "#ff3333");
            }
        }

        // --- 4. AUTO LOGIN TO BACKEND ---
        async function performAutoLogin() {
            // بما أن البصمة صحيحة، نقوم بتسجيل الدخول تلقائياً في الخلفية باستخدام الباسورد المحفوظ (مجازياً)
            // أو نطلب من البايثون جلسة خاصة. للتبسيط هنا، سنستخدم بيانات الأدمن المعروفة
            // تحذير: هذا محاكاة، في الوضع الحقيقي نستخدم Token
            
            const formData = new FormData();
            formData.append('username', 'Abdallah'); // Hardcoded trusted user based on bio
            formData.append('password', 'asdfghjkl05896');

            const res = await fetch('/login', { method: 'POST', body: formData });
            if (res.ok) grantAccess();
        }

        function grantAccess() {
            setStatus("ACCESS GRANTED. REDIRECTING...", "#00ff88");
            document.querySelector('.access-card').style.transform = "scale(1.1)";
            document.querySelector('.access-card').style.opacity = "0";
            setTimeout(() => window.location.href = '/', 800);
        }

    </script>
</body>
</html>
