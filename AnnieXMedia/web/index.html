<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan OS | Kernel Loader</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Fonts (Cairo for Arabic match) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <style>
        /* --- Performance & Reset --- */
        body { 
            margin: 0; 
            background-color: #000; 
            color: #fff; 
            font-family: 'Cairo', sans-serif; 
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* --- GPU Accelerated Glass --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: translateZ(0); /* Force GPU */
            will-change: transform, opacity;
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* --- Input Fields Style --- */
        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: #06b6d4; /* Cyan */
            outline: none;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        /* --- Loading Bar Animation --- */
        .loader-track {
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            border-radius: 99px;
        }
        .loader-fill {
            background: white;
            height: 100%;
            width: 0%;
            border-radius: 99px;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* --- Utilities --- */
        .hidden-opacity { opacity: 0; pointer-events: none; position: absolute; }
        .visible-opacity { opacity: 1; pointer-events: auto; position: relative; }
        
        /* Iframe Fullscreen */
        #os-frame {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            border: none; z-index: 10; opacity: 0; transition: opacity 1s ease;
            background: #000;
        }

        /* Logs Console */
        #console-log {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            line-height: 1.4;
            color: #00ffaa;
            text-shadow: 0 0 2px rgba(0, 255, 170, 0.5);
            direction: ltr; /* Logs always LTR */
        }
    </style>
</head>
<body>

    <!-- 1. MAIN CONTAINER (Centered) -->
    <div id="kernel-layer" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6">
        
        <!-- Background Ambient Glow (Static for performance) -->
        <div class="absolute inset-0 z-[-1] overflow-hidden">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-cyan-500/10 rounded-full blur-[80px]"></div>
        </div>

        <!-- THE GLASS CARD -->
        <div id="main-card" class="glass-panel w-full max-w-sm rounded-[30px] p-8 flex flex-col items-center text-center relative overflow-hidden min-h-[350px] justify-center">
            
            <!-- A. BOOT STATE -->
            <div id="boot-view" class="w-full flex flex-col items-center transition-all duration-500">
                <div class="mb-6 relative">
                    <div class="absolute inset-0 bg-white/20 blur-xl rounded-full animate-pulse"></div>
                    <i data-lucide="layers" class="w-16 h-16 text-white relative z-10"></i>
                </div>
                
                <h1 class="text-2xl font-bold mb-2 tracking-wide">نظام تايتان</h1>
                <p id="boot-text" class="text-white/50 text-xs mb-8 font-mono">جاري تهيئة النواة...</p>
                
                <!-- Loading Bar -->
                <div class="w-full h-1.5 loader-track mb-2">
                    <div id="progress-bar" class="loader-fill"></div>
                </div>
            </div>

            <!-- B. LOGIN STATE (Hidden Initially) -->
            <div id="login-view" class="w-full flex flex-col items-center hidden-opacity transition-all duration-500 transform scale-95">
                <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-6 shadow-lg">
                    <i data-lucide="shield-check" class="w-8 h-8 text-cyan-400"></i>
                </div>
                <h2 class="text-xl font-bold mb-1 text-white">تسجيل الدخول</h2>
                <p class="text-white/40 text-xs mb-6">مطلوب تصريح أمني - المستوى 10</p>

                <form id="login-form" class="w-full space-y-3">
                    <input type="text" id="user" placeholder="اسم المستخدم" class="glass-input w-full rounded-xl py-3 px-4 text-sm text-center font-bold" autocomplete="off">
                    <input type="password" id="pass" placeholder="كلمة المرور" class="glass-input w-full rounded-xl py-3 px-4 text-sm text-center font-mono tracking-widest">
                    
                    <div id="error-msg" class="h-4 text-[10px] text-red-400 font-bold opacity-0 transition-opacity"></div>

                    <button type="submit" class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-cyan-50 active:scale-95 transition-all shadow-[0_0_20px_rgba(255,255,255,0.2)] mt-2">
                        فتح النظام
                    </button>
                </form>
            </div>

        </div>

        <!-- CONSOLE LOGGER (Bottom) -->
        <div id="console-wrapper" class="absolute bottom-8 w-[90%] max-w-md h-24 bg-black/40 border border-white/5 rounded-xl backdrop-blur-md overflow-hidden p-3 transition-opacity duration-1000 opacity-0">
            <div id="console-log" class="h-full overflow-y-auto flex flex-col justify-end"></div>
        </div>
    </div>

    <!-- 2. THE OS FRAME (Where iOS_Dashboard loads) -->
    <iframe id="os-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

    <!-- 3. ERROR OVERLAY (Panic Screen) -->
    <div id="panic-screen" class="fixed inset-0 z-[999] bg-black hidden flex-col items-center justify-center text-red-500 p-8 font-mono text-left" dir="ltr">
        <h1 class="text-4xl font-bold mb-4">KERNEL_PANIC</h1>
        <p class="text-white/70 mb-8 border-b border-white/20 pb-4 w-full">System halted due to a fatal error.</p>
        <div class="bg-red-900/10 border border-red-500/30 p-4 rounded w-full text-xs break-all" id="panic-details">
            Error details will appear here.
        </div>
        <button onclick="location.reload()" class="mt-8 px-6 py-2 border border-red-500 text-red-500 hover:bg-red-500 hover:text-white transition">REBOOT SYSTEM</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CREDENTIALS = { u: "Abdallah", p: "asdfghjkl05896" };
        const FILES = { dashboard: "iOS_Dashboard.html", player: "Interactive_Player.html" };
        
        // --- SYSTEM CORE ---
        const System = {
            logs: [],
            
            // Fast Logger (Non-blocking)
            log: function(msg) {
                const consoleEl = document.getElementById('console-log');
                const line = document.createElement('div');
                line.textContent = `> ${msg}`;
                consoleEl.appendChild(line);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            },

            // Panic Handler
            panic: function(msg) {
                document.getElementById('panic-screen').style.display = 'flex';
                document.getElementById('panic-details').innerText = msg;
                console.error(msg);
            },

            // File Check (Smart)
            verifyFiles: async function() {
                this.log("Checking filesystem integrity...");
                try {
                    const req = await fetch(FILES.dashboard, { method: 'HEAD' });
                    if (!req.ok) throw new Error(`Missing: ${FILES.dashboard}`);
                    this.log(`${FILES.dashboard} ... OK`);
                    return true;
                } catch (e) {
                    // Try to proceed anyway but warn, or panic if strict
                    this.log(`WARNING: ${e.message}`);
                    return false; // Return false to indicate issue, but we might let them try
                }
            },

            // The Boot Sequence
            boot: async function() {
                lucide.createIcons();
                document.getElementById('console-wrapper').style.opacity = '0.7';

                const bar = document.getElementById('progress-bar');
                const status = document.getElementById('boot-text');

                // 1. Simulate fast loading logs (The "500 lines" effect)
                let progress = 0;
                const modules = ["Kernel", "Memory", "GPU_Driver", "Audio_Engine", "Security_Matrix", "React_Core", "FileSystem"];
                
                const interval = setInterval(() => {
                    progress += Math.random() * 5;
                    if(progress > 100) progress = 100;
                    bar.style.width = `${progress}%`;
                    
                    if(Math.random() > 0.5) {
                        const mod = modules[Math.floor(Math.random() * modules.length)];
                        this.log(`Loading ${mod}... OK [${Math.random().toFixed(3)}ms]`);
                    }

                    if(progress === 100) {
                        clearInterval(interval);
                        this.finishBoot();
                    }
                }, 50);

                // Check files in parallel
                const filesOk = await this.verifyFiles();
                if(!filesOk) {
                    clearInterval(interval);
                    bar.style.backgroundColor = "red";
                    status.innerText = "خطأ في ملفات النظام!";
                    status.style.color = "red";
                    setTimeout(() => this.panic(`CRITICAL: ${FILES.dashboard} not found in directory. Ensure all files are in the same folder.`), 1500);
                }
            },

            finishBoot: function() {
                const bootView = document.getElementById('boot-view');
                const loginView = document.getElementById('login-view');
                const card = document.getElementById('main-card');

                document.getElementById('boot-text').innerText = "النظام جاهز.";
                
                setTimeout(() => {
                    // Smooth Morph Transition
                    bootView.style.opacity = '0';
                    bootView.style.transform = 'scale(0.9)';
                    
                    setTimeout(() => {
                        bootView.style.display = 'none';
                        
                        loginView.classList.remove('hidden-opacity', 'scale-95');
                        loginView.classList.add('visible-opacity', 'scale-100');
                        
                        // Focus user input
                        document.getElementById('user').focus();
                    }, 500);
                }, 800);
            },

            launch: function() {
                // Fade out kernel layer
                const layer = document.getElementById('kernel-layer');
                layer.style.opacity = '0';
                layer.style.transform = 'scale(1.1)';
                layer.style.pointerEvents = 'none';

                // Fade in OS
                const frame = document.getElementById('os-frame');
                frame.src = FILES.dashboard;
                frame.style.opacity = '1';
                
                // Show floating logger after delay
                setTimeout(() => {
                    layer.style.display = 'none';
                }, 1000);
            }
        };

        // --- AUTHENTICATION HANDLER ---
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const err = document.getElementById('error-msg');
            const card = document.getElementById('main-card');

            System.log(`Auth request: ${u}`);

            if (u === CREDENTIALS.u && p === CREDENTIALS.p) {
                System.log("Access Granted.");
                System.launch();
            } else {
                System.log("Access Denied.");
                err.innerText = "بيانات الدخول غير صحيحة";
                err.style.opacity = '1';
                
                // Shake Animation
                card.style.transform = "translateX(10px)";
                setTimeout(() => card.style.transform = "translateX(-10px)", 100);
                setTimeout(() => card.style.transform = "translateX(0)", 200);
            }
        });

        // --- GLOBAL ERROR TRAP ---
        window.onerror = function(message, source, lineno, colno, error) {
            System.panic(`SCRIPT_ERROR: ${message}\nAt: ${source}:${lineno}`);
            return true;
        };

        // Start
        window.onload = () => System.boot();

    </script>
</body>
</html>
