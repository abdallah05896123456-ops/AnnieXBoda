<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Titan OS - Control Panel">
    
    <title>Titan OS | لوحة التحكم</title>
    
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- ملف الستايل (لو فيه مشكلة هيحمل الستايل الاحتياطي) -->
    <link rel="stylesheet" href="{{ url_for('web.static', filename='style.css') }}?v=5">
    
    <style>
        /* ستايل الطوارئ: يضمن ظهور الخلفية حتى لو ملف الـ CSS فشل */
        body { margin: 0; background: #000; color: #fff; font-family: 'Cairo', sans-serif; overflow: hidden; }
        .preloader-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; transition: opacity 0.5s; }
        .logo-text { font-size: 2rem; font-weight: 900; letter-spacing: 2px; }
        .highlight { color: #007aff; }
        
        /* تحسينات لضمان ظهور العناصر */
        .glass-panel, .glass-widget, .glass-dock { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active { display: block !important; }
        .view-screen { display: none; height: 100%; overflow-y: auto; padding-bottom: 80px; }
        .view-screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- 1. الخلفية -->
    <div class="app-wallpaper">
        <div class="mesh-gradient">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
        <div class="glass-overlay"></div>
    </div>

    <!-- 2. شاشة التحميل -->
    <div id="preloader" class="preloader-screen">
        <div class="loader-content">
            <div class="logo-text">Titan <span class="highlight">OS</span></div>
            <div class="loading-bar"><div class="bar-fill"></div></div>
            <p class="loading-text" id="loading-msg">جاري تحميل النظام...</p>
        </div>
    </div>

    <!-- 3. التطبيق الرئيسي -->
    <div class="ios-frame" id="main-app" style="opacity: 0; transition: opacity 0.8s;">
        
        <!-- الهيدر -->
        <header class="status-header glass-panel-sm">
            <div class="right-side">
                <i class="fas fa-wifi signal-icon"></i>
                <i class="fas fa-battery-three-quarters battery-icon"></i>
            </div>
            <div class="center-time" id="clock-display">--:--</div>
            <div class="left-side">
                <span class="carrier-name">Titan 5G</span>
                <i class="fas fa-signal"></i>
            </div>
        </header>

        <!-- المحتوى -->
        <main class="viewport-area">
            <!-- أ) الرئيسية -->
            <section id="view-home" class="view-screen active">
                <div class="screen-header">
                    <div>
                        <h1 class="page-title">مرحباً، المطور 👋</h1>
                        <p class="page-subtitle">نظرة عامة على النظام</p>
                    </div>
                    <div class="user-avatar-sm">
                        <img src="https://telegra.ph/file/5a5d09854728704253158.jpg" alt="Admin" onerror="this.src='https://via.placeholder.com/50'">
                        <span class="status-dot"></span>
                    </div>
                </div>

                <div class="widgets-grid">
                    <div class="glass-widget stats-widget">
                        <div class="widget-icon"><i class="fas fa-memory"></i></div>
                        <div class="widget-data">
                            <span class="stat-val" id="ram-usage">--%</span>
                            <span class="stat-label">RAM</span>
                        </div>
                        <div class="mini-chart" id="ram-chart"></div>
                    </div>
                    <div class="glass-widget stats-widget">
                        <div class="widget-icon color-warn"><i class="fas fa-microchip"></i></div>
                        <div class="widget-data">
                            <span class="stat-val" id="cpu-usage">--%</span>
                            <span class="stat-label">CPU</span>
                        </div>
                    </div>
                </div>

                <div class="section-title">
                    <h3>البث النشط</h3>
                    <span class="badge-count" id="active-count">0</span>
                </div>
                <div id="active-streams-container" class="scroll-content">
                    <div class="empty-placeholder">
                        <i class="fas fa-music" style="font-size: 30px; opacity: 0.5;"></i>
                        <p>لا يوجد تشغيل حالياً</p>
                    </div>
                </div>
            </section>

            <!-- ب) الخزنة -->
            <section id="view-vault" class="view-screen">
                <div class="screen-header">
                    <h1 class="page-title">الخزنة</h1>
                    <button class="glass-btn-icon" onclick="document.getElementById('file-upload').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </button>
                    <input type="file" id="file-upload" hidden onchange="Vault.uploadFile(this)">
                </div>
                <div class="vault-stats glass-panel">
                    <div class="v-stat"><i class="fas fa-hdd"></i><span id="disk-space">--</span></div>
                    <div class="v-divider"></div>
                    <div class="v-stat"><i class="fas fa-file-audio"></i><span id="files-total">0</span></div>
                </div>
                <div id="vault-files-list" class="files-grid scroll-content"></div>
            </section>

            <!-- ج) الطرفية -->
            <section id="view-terminal" class="view-screen">
                <div class="screen-header">
                    <h1 class="page-title">Terminal</h1>
                    <div class="terminal-indicator online"></div>
                </div>
                <div class="terminal-window glass-panel-dark">
                    <div class="term-output" id="term-output-area">
                        <div class="term-line sys">Titan OS v3.0 Ready...</div>
                    </div>
                    <div class="term-input-wrapper">
                        <span class="prompt-char">➜</span>
                        <input type="text" id="term-cmd-input" placeholder="Enter command..." autocomplete="off">
                        <button id="send-cmd-btn" onclick="Terminal.sendCommand()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </section>
            
             <!-- د) الإعدادات -->
            <section id="view-settings" class="view-screen">
                 <div class="screen-header"><h1 class="page-title">الإعدادات</h1></div>
                <div class="glass-panel"><p style="text-align:center; padding:20px; color:#aaa;">قريباً...</p></div>
            </section>
        </main>

        <!-- 4. الدوك السفلي -->
        <nav class="dock-wrapper">
            <div class="glass-dock">
                <div class="dock-item active" data-target="view-home" onclick="App.nav('home')">
                    <div class="icon-box"><i class="fas fa-th-large"></i></div>
                    <span class="icon-label">Home</span>
                </div>
                <div class="dock-item" data-target="view-vault" onclick="App.nav('vault')">
                    <div class="icon-box"><i class="fas fa-folder-open"></i></div>
                    <span class="icon-label">Vault</span>
                </div>
                <div class="dock-item" data-target="view-terminal" onclick="App.nav('terminal')">
                    <div class="icon-box"><i class="fas fa-terminal"></i></div>
                    <span class="icon-label">Term</span>
                </div>
                <div class="dock-item" data-target="view-settings" onclick="App.nav('settings')">
                    <div class="icon-box"><i class="fas fa-sliders-h"></i></div>
                    <span class="icon-label">Set</span>
                </div>
            </div>
        </nav>

        <!-- 5. نافذة المشغل -->
        <div id="player-modal" class="modal-overlay">
            <div class="modal-backdrop" onclick="Player.close()"></div>
            <div class="modal-card glass-panel-heavy">
                <div class="modal-handle-bar"></div>
                <div class="modal-header-row">
                    <button class="close-btn" onclick="Player.close()"><i class="fas fa-chevron-down"></i></button>
                    <span class="playing-status">NOW PLAYING</span>
                    <button class="options-btn"><i class="fas fa-ellipsis-h"></i></button>
                </div>
                <div class="album-art-area">
                    <div class="art-glow"></div>
                    <img id="p-cover" src="" class="main-cover" onerror="this.style.display='none'">
                    <div class="requester-badge"><img id="p-user-img" src=""><i class="fas fa-microphone icon-tiny"></i></div>
                </div>
                <div class="track-details">
                    <h2 id="p-track-title" class="scrolling-text">--</h2>
                    <p id="p-group-name">--</p>
                </div>
                <div class="progress-area">
                    <div class="progress-bar">
                        <div class="progress-fill" id="p-progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="time-row"><span id="p-current-time">0:00</span><span id="p-total-time">0:00</span></div>
                </div>
                <div class="controls-row main">
                    <button class="ctrl-btn sm" onclick="Player.action('ban')"><i class="fas fa-ban"></i></button>
                    <button class="ctrl-btn md" onclick="Player.action('skip')"><i class="fas fa-step-forward"></i></button>
                    <button class="ctrl-btn lg play-pause" id="play-btn" onclick="Player.toggle()"><i class="fas fa-pause"></i></button>
                    <button class="ctrl-btn md" onclick="Player.action('stop')"><i class="fas fa-stop"></i></button>
                    <button class="ctrl-btn sm" onclick="Player.action('focus')"><i class="fas fa-rocket"></i></button>
                </div>
            </div>
        </div>

        <!-- 6. الإشعارات -->
        <div id="toast-area" class="toast-wrapper"></div>
    </div>

    <!-- ======================================================
       🔥 محرك TITAN OS (JS مدمج)
    ====================================================== -->
    <script>
        /**
         * TITAN OS - ULTIMATE CORE ENGINE (MERGED)
         */
        'use strict';

        /* 1. CONFIG & UTILS */
        const Config = {
            apiBase: '/api',
            pollInterval: 3000,
            debug: true
        };

        const Utils = {
            formatTime: (seconds) => {
                if (!seconds || isNaN(seconds)) return "0:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            },
            formatSize: (bytes) => {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            },
            vibrate: (pattern = 10) => { if (navigator.vibrate) navigator.vibrate(pattern); },
            generateColor: () => `hsl(${Math.floor(Math.random() * 360)}, 70%, 60%)`
        };

        /* 2. API HANDLER */
        class ApiService {
            static async get(endpoint) {
                try {
                    const res = await fetch(`${Config.apiBase}${endpoint}`);
                    if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                    return await res.json();
                } catch (err) {
                    // console.error(`API GET Error:`, err);
                    return null; 
                }
            }

            static async post(endpoint, body) {
                try {
                    const res = await fetch(`${Config.apiBase}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    return await res.json();
                } catch (err) {
                    return { success: false, error: err.message };
                }
            }

            static async upload(endpoint, formData) {
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', `${Config.apiBase}${endpoint}`, true);
                    xhr.onload = () => {
                        if (xhr.status === 200) {
                            try { resolve(JSON.parse(xhr.responseText)); } catch (e) { resolve({ success: true }); }
                        } else { reject(xhr.statusText); }
                    };
                    xhr.onerror = () => reject("Network Error");
                    xhr.send(formData);
                });
            }
        }

        /* 3. UI CONTROLLER */
        class UI {
            static showToast(message, type = 'info', icon = 'info-circle') {
                const container = document.getElementById('toast-area');
                const toast = document.createElement('div');
                let color = '#007aff';
                if (type === 'success') color = '#34c759';
                if (type === 'error') color = '#ff3b30';

                toast.className = 'glass-toast';
                toast.style.cssText = `
                    background: rgba(20, 20, 20, 0.9);
                    backdrop-filter: blur(20px);
                    border: 1px solid rgba(255,255,255,0.1);
                    color: #fff;
                    padding: 12px 20px;
                    border-radius: 50px;
                    margin-bottom: 10px;
                    display: flex; align-items: center; gap: 10px;
                    font-size: 14px;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                    animation: slideUpFade 0.4s ease forwards;
                    min-width: 200px;
                    justify-content: center;
                `;
                toast.innerHTML = `<i class="fas fa-${icon}" style="color: ${color}"></i> <span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            static initClock() {
                const el = document.getElementById('clock-display');
                if(!el) return;
                setInterval(() => {
                    const now = new Date();
                    el.innerText = now.toLocaleTimeString('en-US', {
                        hour: '2-digit', minute: '2-digit', hour12: false
                    });
                }, 1000);
            }
        }

        /* 4. ROUTER */
        class Router {
            constructor() {
                this.views = document.querySelectorAll('.view-screen');
                this.navItems = document.querySelectorAll('.dock-item');
                this.currentView = 'home';
            }

            nav(target) {
                if (this.currentView === target) return;
                this.navItems.forEach(item => {
                    if (item.dataset.target === `view-${target}`) item.classList.add('active');
                    else item.classList.remove('active');
                });
                this.views.forEach(view => {
                    if (view.id === `view-${target}`) view.classList.add('active');
                    else view.classList.remove('active');
                });
                this.currentView = target;
                Utils.vibrate(15);
                if (target === 'vault') Vault.loadFiles();
                if (target === 'home') Dashboard.update();
            }
        }

        /* 5. DASHBOARD */
        class DashboardController {
            constructor() {
                this.ramEl = document.getElementById('ram-usage');
                this.cpuEl = document.getElementById('cpu-usage');
                this.activeCountEl = document.getElementById('active-count');
                this.streamsListEl = document.getElementById('active-streams-container');
            }

            async update() {
                const stats = await ApiService.get('/system/stats');
                if (stats && this.ramEl) {
                    this.ramEl.innerText = `${stats.memory.percent}%`;
                    this.cpuEl.innerText = `${stats.cpu.total}%`;
                }

                const dashData = await ApiService.get('/player/dashboard');
                if (dashData) {
                    this.renderStreams(dashData.chats || []);
                }
            }

            renderStreams(chats) {
                if(this.activeCountEl) this.activeCountEl.innerText = chats.length;
                if(!this.streamsListEl) return;

                if (chats.length === 0) {
                    this.streamsListEl.innerHTML = `
                        <div class="empty-placeholder" style="text-align:center; padding:20px; color:#aaa;">
                            <i class="fas fa-music" style="font-size:30px; margin-bottom:10px;"></i>
                            <p>لا يوجد بث نشط</p>
                        </div>`;
                    return;
                }

                this.streamsListEl.innerHTML = chats.map(chat => `
                    <div class="glass-row-card" onclick='Player.openModal(${JSON.stringify(chat)})' style="background:rgba(255,255,255,0.05); padding:10px; border-radius:15px; margin-bottom:10px; display:flex; gap:10px; align-items:center;">
                        <img src="${chat.cover}" style="width:50px; height:50px; border-radius:10px;" onerror="this.src='https://via.placeholder.com/60'">
                        <div>
                            <h4 style="margin:0; font-size:14px;">${chat.track}</h4>
                            <p style="margin:0; font-size:12px; opacity:0.7;">${chat.title}</p>
                        </div>
                    </div>
                `).join('');
            }
        }

        /* 6. PLAYER */
        class PlayerEngine {
            constructor() {
                this.modal = document.getElementById('player-modal');
                this.currentChat = null;
            }

            openModal(chat) {
                this.currentChat = chat;
                document.getElementById('p-cover').src = chat.cover;
                document.getElementById('p-track-title').innerText = chat.track;
                document.getElementById('p-group-name').innerText = chat.title;
                this.modal.classList.add('open');
                // استايل بسيط لفتح المودال
                this.modal.style.display = 'flex';
                this.modal.style.opacity = '1';
                Utils.vibrate(20);
            }

            close() {
                // this.modal.classList.remove('open');
                this.modal.style.display = 'none';
            }

            toggle() { this.action('resume'); }

            async action(cmd) {
                if (!this.currentChat) return;
                Utils.vibrate(15);
                UI.showToast(`تم إرسال الأمر: ${cmd}`);
                const res = await ApiService.post('/player/group_action', {
                    action: cmd,
                    chat_id: this.currentChat.chat_id
                });
                if (res.success && (cmd === 'stop' || cmd === 'ban')) this.close();
                Dashboard.update();
            }
        }

        /* 7. VAULT */
        class VaultManager {
            constructor() {
                this.container = document.getElementById('vault-files-list');
                this.statsEls = { disk: document.getElementById('disk-space'), count: document.getElementById('files-total') };
            }

            async loadFiles() {
                this.container.innerHTML = '<div style="text-align:center;">جاري التحميل...</div>';
                const [filesData, statsData] = await Promise.all([
                    ApiService.get('/vault/list?sort=date'),
                    ApiService.get('/vault/stats')
                ]);

                if (statsData && this.statsEls.disk) {
                    this.statsEls.disk.innerText = statsData.used_vault;
                    this.statsEls.count.innerText = `${statsData.files_count.audio + statsData.files_count.video}`;
                }
                this.renderFiles(filesData ? filesData.files : []);
            }

            renderFiles(files) {
                if (!files || files.length === 0) {
                    this.container.innerHTML = '<div class="empty-placeholder" style="text-align:center;">الخزنة فارغة</div>';
                    return;
                }
                this.container.innerHTML = files.map(f => `
                    <div class="file-card" style="padding:10px; border-bottom:1px solid rgba(255,255,255,0.1);">
                        <div class="file-name">${f.name}</div>
                        <div style="font-size:10px; color:#aaa;">${f.size}</div>
                    </div>`).join('');
            }

            async uploadFile(input) {
                const file = input.files[0];
                if (!file) return;
                UI.showToast(`جاري رفع: ${file.name}`);
                const formData = new FormData();
                formData.append('file', file);
                try {
                    await ApiService.upload('/vault/upload', formData);
                    UI.showToast('تم الرفع ✅', 'success');
                    this.loadFiles();
                } catch (err) { UI.showToast('فشل الرفع', 'error'); }
            }
        }

        /* 8. TERMINAL */
        class TerminalEmulator {
            constructor() {
                this.output = document.getElementById('term-output-area');
                this.input = document.getElementById('term-cmd-input');
            }

            async sendCommand() {
                const cmd = this.input.value.trim();
                if (!cmd) return;
                this.input.value = '';
                this.output.innerHTML += `<div class="term-line" style="color:#0f0;">root@titan:~# ${cmd}</div>`;
                const res = await ApiService.post('/system/terminal', { command: cmd });
                this.output.innerHTML += `<div class="term-line">${res && res.output ? res.output.replace(/\n/g,'<br>') : 'Done.'}</div>`;
                this.output.scrollTop = this.output.scrollHeight;
            }
        }

        /* 9. BOOT & INITIALIZATION */
        const App = new Router();
        const Dashboard = new DashboardController();
        const Player = new PlayerEngine();
        const Vault = new VaultManager();
        const Terminal = new TerminalEmulator();

        // تعريض الكائنات للـ Window عشان الـ OnClick في HTML يشوفهم
        window.App = App;
        window.Player = Player;
        window.Vault = Vault;
        window.Terminal = Terminal;
        window.UI = UI;

        window.addEventListener('load', () => {
            console.log("TITAN OS Booting...");

            // 1. إخفاء شاشة التحميل (Fake Boot)
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                const app = document.getElementById('main-app');
                if (preloader) {
                    preloader.style.opacity = '0';
                    setTimeout(() => preloader.style.display = 'none', 500);
                }
                if (app) app.style.opacity = '1';
            }, 1500);

            // 2. تشغيل الخدمات
            UI.initClock();
            Dashboard.update();
            setInterval(() => Dashboard.update(), Config.pollInterval);
        });
        
        // 🔥 Nuclear Failsafe: مفتاح الطوارئ
        // لو لأي سبب الموقع علق، ده هيفتحه غصب بعد 3 ثواني
        setTimeout(() => {
            const preloader = document.getElementById('preloader');
            if (preloader && getComputedStyle(preloader).display !== 'none') {
                console.warn("Force unlocking dashboard...");
                preloader.style.display = 'none';
                document.getElementById('main-app').style.opacity = '1';
            }
        }, 3000);

    </script>
</body>
</html>
