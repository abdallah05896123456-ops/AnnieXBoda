<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DashX Ultimate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('web.static', filename='style.css') }}">
</head>
<body class="theme-red">
    <div class="ambient-bg">
        <div class="light-orb top-left"></div>
        <div class="light-orb bottom-right"></div>
    </div>

    <!-- Header -->
    <header class="glass-header">
        <div class="status-pill">
            <div class="dot"></div>
            <span id="system-status">جاري الاتصال...</span>
        </div>
        <div class="logo">DASH<span style="color:var(--accent)">X</span></div>
        <div class="profile-pic">
            <img src="https://telegra.ph/file/8b3e21894d3062325c04b.jpg" alt="User">
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- 1. تبويب المشغل (الرئيسي) -->
        <div id="tab-home" class="view active">
            <div class="main-player glass-panel">
                <div class="artwork-container">
                    <img id="track-art" src="" class="art-img" alt="Art">
                </div>
                <div class="track-details">
                    <h2 id="track-title">Loading...</h2>
                    <p id="track-artist">Please wait</p>
                </div>
                
                <div class="waveform-bar">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="progress-area">
                    <input type="range" class="seek-slider" value="0" min="0" max="100">
                    <div class="time-info">
                        <span class="time-current">0:00</span>
                        <span class="time-total">0:00</span>
                    </div>
                </div>

                <div class="player-controls">
                    <button class="ctrl-btn"><i class="fas fa-random"></i></button>
                    <button class="ctrl-btn" onclick="sendCommand('prev')"><i class="fas fa-backward"></i></button>
                    <button class="ctrl-btn lg play-glow"><i class="fas fa-play"></i></button>
                    <button class="ctrl-btn" onclick="sendCommand('skip')"><i class="fas fa-forward"></i></button>
                    <button class="ctrl-btn"><i class="fas fa-redo"></i></button>
                </div>
            </div>

            <div class="stats-row">
                <div class="glass-box">
                    <i class="fas fa-users"></i>
                    <div class="num">0</div>
                    <div class="lbl">مستمع</div>
                </div>
                <div class="glass-box">
                    <i class="fas fa-wifi"></i>
                    <div class="num">0ms</div>
                    <div class="lbl">Ping</div>
                </div>
            </div>
        </div>

        <!-- 2. تبويب الخزنة (Vault) -->
        <div id="tab-vault" class="view">
            <div class="glass-panel" style="padding:15px; margin-bottom:10px;">
                <h3><i class="fas fa-hdd"></i> الخزنة المحلية</h3>
            </div>
            <div class="vault-grid">
                <!-- سيتم ملؤها بالجافاسكريبت -->
            </div>
        </div>

        <!-- 3. تبويب مراقبة النظام (Sudo Stats) -->
        <div id="tab-stats" class="view">
            <div class="glass-panel settings-card">
                <h3><i class="fas fa-server"></i> حالة السيرفر</h3>
                <br>
                <!-- CPU -->
                <div class="setting-row" style="display:block;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <span>CPU Load</span>
                        <span id="cpu-val">0%</span>
                    </div>
                    <div class="progress-bar-bg"><div id="cpu-bar" class="progress-bar-fill" style="width:0%"></div></div>
                </div>
                <!-- RAM -->
                <div class="setting-row" style="display:block;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <span>RAM Usage</span>
                        <span id="ram-val">0%</span>
                    </div>
                    <div class="progress-bar-bg"><div id="ram-bar" class="progress-bar-fill" style="width:0%"></div></div>
                    <small id="ram-text" style="color:var(--text-secondary)">0 / 0 GB</small>
                </div>
                <!-- Disk -->
                <div class="setting-row" style="display:block;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <span>Disk Space</span>
                        <span id="disk-val">0%</span>
                    </div>
                    <div class="progress-bar-bg"><div id="disk-bar" class="progress-bar-fill" style="width:0%"></div></div>
                </div>
                
                <div class="stats-row">
                    <div class="glass-box">
                        <i class="fas fa-clock"></i>
                        <div id="uptime-val" class="num">00:00</div>
                        <div class="lbl">Uptime</div>
                    </div>
                </div>
            </div>
            
            <!-- Terminal Widget -->
            <div class="glass-panel settings-card">
                <h3><i class="fas fa-terminal"></i> Terminal (Sudo)</h3>
                <div id="term-output" class="terminal-output">Welcome to DashX Terminal...</div>
                <div class="terminal-input-row">
                    <span>$</span>
                    <input type="text" id="term-input" placeholder="Type command..." onkeypress="handleTerm(event)">
                </div>
            </div>
        </div>

        <!-- 4. تبويب الإعدادات -->
        <div id="tab-settings" class="view">
            <div class="glass-panel settings-card">
                <h3>تخصيص المظهر</h3>
                <div class="color-picker-row">
                    <div class="color-dot red selected" onclick="setTheme('red')"></div>
                    <div class="color-dot blue" onclick="setTheme('blue')"></div>
                    <div class="color-dot green" onclick="setTheme('green')"></div>
                    <div class="color-dot purple" onclick="setTheme('purple')"></div>
                    <div class="color-dot gold" onclick="setTheme('gold')"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dock (Bottom Navigation) -->
    <nav class="glass-dock">
        <button class="dock-btn active" onclick="switchTab('home')">
            <i class="fas fa-home"></i>
            <span>الرئيسية</span>
        </button>
        <button class="dock-btn" onclick="switchTab('vault')">
            <i class="fas fa-folder-open"></i>
            <span>الخزنة</span>
        </button>
        
        <div class="fab-main">
            <div class="fab-glow" onclick="sendCommand('play')">
                <i class="fas fa-microphone"></i>
            </div>
        </div>

        <button class="dock-btn" onclick="switchTab('stats')">
            <i class="fas fa-chart-pie"></i>
            <span>النظام</span>
        </button>
        <button class="dock-btn" onclick="switchTab('settings')">
            <i class="fas fa-cog"></i>
            <span>إعدادات</span>
        </button>
    </nav>

    <script src="{{ url_for('web.static', filename='app.js') }}"></script>
</body>
</html>
