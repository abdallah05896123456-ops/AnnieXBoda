<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan OS | السجلات الحية</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ستايل خاص بصفحة السجلات */
        .logs-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .terminal-window {
            background-color: #0d0d0d;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            height: 500px;
            overflow-y: auto;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #00ff00;
        }

        .log-line {
            padding: 2px 0;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            gap: 10px;
        }
        .log-line:last-child { border-bottom: none; }
        
        .log-time { color: #888; min-width: 100px; }
        .log-level { font-weight: bold; min-width: 80px; }
        .log-msg { color: #eee; }
        
        .level-INFO { color: #00d2ff; }
        .level-WARNING { color: #ffae00; }
        .level-ERROR { color: #ff4b4b; }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .history-table th, .history-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .history-table th {
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
        }
        
        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="logs-container">
        <a href="/" class="btn-back"><i class="fa-solid fa-arrow-right"></i> العودة للوحة التحكم</a>
        
        <!-- القسم الأول: التيرمينال الحي -->
        <div class="section-header">
            <h2><i class="fa-solid fa-code"></i> Live Terminal Output</h2>
            <div class="status-indicator online"><span class="dot"></span> Connected</div>
        </div>
        
        <div class="terminal-window" id="terminal">
            <div class="log-line">
                <span class="log-time">[System]</span>
                <span class="log-msg">Connecting to TitanOS WebSocket...</span>
            </div>
            <!-- السجلات هتنزل هنا تلقائي -->
        </div>

        <!-- القسم الثاني: سجل قاعدة البيانات -->
        <div class="section-header">
            <h2><i class="fa-solid fa-database"></i> سجل نشاط المشرفين</h2>
        </div>
        
        <table class="history-table">
            <thead>
                <tr>
                    <th>المعرف</th>
                    <th>المشرف</th>
                    <th>الإجراء</th>
                    <th>تفاصيل</th>
                    <th>التوقيت</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td>#{{ log[0] }}</td>
                    <td><span class="badge user">{{ log[1] }}</span></td>
                    <td>{{ log[2] }}</td>
                    <td>{{ log[3] }}</td>
                    <td>{{ log[4] }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" style="text-align:center; color:#888;">لا يوجد سجلات نشاط حتى الآن</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        // كود الاتصال بالسوكت لعرض السجلات الحية
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        const wsUrl = `${protocol}://${window.location.host}/ws/logs`;
        const socket = new WebSocket(wsUrl);
        const terminal = document.getElementById('terminal');

        socket.onopen = () => {
            appendLog("System", "INFO", "Connected to Log Stream Successfully 🚀");
        };

        socket.onmessage = (event) => {
            // نفترض أن الرسالة نصية بسيطة حالياً
            appendLog("Bot", "INFO", event.data);
        };

        socket.onclose = () => {
            appendLog("System", "ERROR", "Connection Lost. Reconnecting...");
        };

        function appendLog(source, level, msg) {
            const div = document.createElement('div');
            div.className = 'log-line';
            
            const timeStr = new Date().toLocaleTimeString('en-US', {hour12: false});
            
            div.innerHTML = `
                <span class="log-time">[${timeStr}]</span>
                <span class="log-level level-${level}">${level}</span>
                <span class="log-msg">${msg}</span>
            `;
            
            terminal.appendChild(div);
            // انزل لآخر سطر تلقائي
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
