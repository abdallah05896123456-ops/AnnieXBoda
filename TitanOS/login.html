<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan OS | دخول آمن</title>
    <!-- خط كايرو للعربي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. متغيرات الألوان والتأسيس --- */
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --dark-bg: #0a0a0a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --error-color: #ff4b4b;
            --neon-glow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- 2. خلفية الكانفاس المتحركة --- */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        }

        /* --- 3. حاوية التسجيل الزجاجية --- */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            perspective: 1000px; /* للأنيميشن 3D */
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px); /* تأثير الزجاج */
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 
                        inset 0 0 20px rgba(255, 255, 255, 0.05);
            transform-style: preserve-3d;
            animation: cardFloat 6s ease-in-out infinite;
            text-align: center;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-10px) rotateX(2deg); }
        }

        /* --- 4. عناصر التصميم --- */
        .logo-area {
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .logo-ring {
            width: 80px;
            height: 80px;
            border: 3px solid var(--primary);
            border-top-color: transparent;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            animation: spin 3s linear infinite;
        }

        .logo-icon {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 15px var(--primary);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* --- 5. حقول الإدخال --- */
        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: right;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 15px 20px 15px 45px; /* مساحة للأيقونة */
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .input-group input:focus + .input-icon {
            color: var(--primary);
        }

        /* --- 6. الزر --- */
        .btn-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn-submit:hover::after {
            left: 100%;
        }

        /* --- 7. رسائل الخطأ --- */
        .error-msg {
            background: rgba(255, 75, 75, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.5s ease-in-out;
        }

        /* --- 8. أنيميشن إضافي --- */
        @keyframes spin {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* الفوتر السفلي */
        .footer-info {
            margin-top: 30px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
        }

        /* شريط التحميل الوهمي */
        .loader-bar {
            height: 3px;
            width: 100%;
            background: rgba(255,255,255,0.1);
            position: absolute;
            bottom: 0;
            left: 0;
            overflow: hidden;
            border-radius: 0 0 24px 24px;
        }
        .loader-progress {
            height: 100%;
            width: 50%;
            background: var(--primary);
            position: absolute;
            animation: load 2s infinite ease-in-out;
        }
        @keyframes load {
            0% { left: -50%; }
            100% { left: 100%; }
        }

    </style>
</head>
<body>

    <!-- الخلفية التفاعلية -->
    <canvas id="particle-canvas"></canvas>

    <div class="login-wrapper">
        <div class="glass-card">
            
            <!-- اللوجو المتحرك -->
            <div class="logo-area">
                <div class="logo-ring"></div>
                <div class="logo-icon">
                    <!-- SVG Logo inline -->
                    <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                </div>
            </div>

            <h1>Titan OS <span style="font-size:0.5em; vertical-align: super; color: var(--primary);">PRO</span></h1>
            <p class="subtitle">نظام التحكم المركزي | AnnieXMedia</p>

            <!-- رسالة الخطأ (تظهر فقط لو السيرفر بعت error) -->
            {% if error %}
            <div class="error-msg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- الفورم -->
            <form action="/login" method="POST">
                
                <div class="input-group">
                    <input type="text" name="username" placeholder="اسم المستخدم" required autocomplete="off">
                    <span class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                </div>

                <div class="input-group">
                    <input type="password" name="password" placeholder="كلمة المرور" required>
                    <span class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                </div>

                <button type="submit" class="btn-submit">
                    تسجيل الدخول
                </button>

            </form>

            <div class="footer-info">
                Protected by Titan Security © 2025<br>
                v3.0.1 Stable Build
            </div>

            <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
    </div>

    <!-- سكريبت الأنيميشن (Particles System) -->
    <script>
        // إعداد الكانفاس
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        // ضبط الحجم
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();

        // كلاس الجزيئات
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5; // سرعة أفقية
                this.vy = (Math.random() - 0.5) * 1.5; // سرعة رأسية
                this.size = Math.random() * 2 + 1;
                this.color = `rgba(${Math.random() * 50}, ${150 + Math.random() * 100}, 255, ${Math.random() * 0.5})`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // الارتداد من الحواف
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // إنشاء الجزيئات
        function initParticles() {
            particles = [];
            const particleCount = Math.min(window.innerWidth / 10, 100); // عدد متجاوب
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        // رسم الخطوط بين الجزيئات القريبة
        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 210, 255, ${1 - distance / 150})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // حلقة التحريك
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            drawLines();
            requestAnimationFrame(animate);
        }

        // البدء
        initParticles();
        animate();

        // إضافة تفاعل بسيط للماوس
        document.addEventListener('mousemove', (e) => {
            // إضافة اضطراب بسيط للجزيئات عند حركة الماوس
            particles.forEach(p => {
                const dx = e.clientX - p.x;
                const dy = e.clientY - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 100) {
                    p.vx += dx * 0.001;
                    p.vy += dy * 0.001;
                }
            });
        });

    </script>
</body>
</html>
