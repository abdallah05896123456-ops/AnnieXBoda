<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan OS • Biometric Security</title>
    
    <!-- Security Metas -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#000000">

    <!-- iOS Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=SF+Pro+Display:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* =========================================
           1. CORE SYSTEM (iOS 17 DARK MODE)
           ========================================= */
        :root {
            --bg-deep: #000000;
            --glass-material: rgba(22, 22, 24, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --ios-blue: #0A84FF;
            --ios-green: #30D158;
            --ios-red: #FF453A;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(235, 235, 245, 0.6);
            --blur: 50px;
            --radius: 38px;
            --input-bg: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        
        body {
            margin: 0; padding: 0; height: 100vh;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: -apple-system, "SF Pro Display", "Cairo", sans-serif;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; perspective: 1000px;
        }

        /* Starfield Background */
        #star-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* =========================================
           2. THE BLACK GLASS CARD
           ========================================= */
        .login-container {
            width: 100%; max-width: 380px; padding: 40px 30px;
            background: var(--glass-material);
            backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 100px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.05);
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            position: relative;
            z-index: 10;
        }

        /* Branding */
        .lock-icon {
            font-size: 3rem; margin-bottom: 15px;
            background: linear-gradient(135deg, #fff 20%, #666 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
            animation: pulseLock 3s infinite;
        }
        @keyframes pulseLock { 0%,100%{opacity:0.8} 50%{opacity:1; text-shadow:0 0 20px rgba(255,255,255,0.4)} }

        .title { font-size: 1.6rem; font-weight: 700; margin-bottom: 5px; letter-spacing: -0.5px; }
        .subtitle { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 30px; font-weight: 400; }

        /* =========================================
           3. INPUTS & FORMS
           ========================================= */
        .input-wrapper { position: relative; margin-bottom: 16px; width: 100%; }
        
        .ios-input {
            width: 100%; padding: 18px 20px; padding-right: 50px;
            background: var(--input-bg); border: 1px solid transparent;
            border-radius: 18px; color: #fff; font-size: 1.05rem;
            transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .ios-input:focus {
            background: rgba(255,255,255,0.15); border-color: var(--ios-blue);
            transform: scale(1.02); box-shadow: 0 10px 30px rgba(10, 132, 255, 0.15);
        }
        .input-icon {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.4); pointer-events: none;
        }

        /* Buttons */
        .btn {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            transition: 0.2s; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary {
            background: #fff; color: #000;
            box-shadow: 0 5px 20px rgba(255,255,255,0.15);
        }
        .btn-primary:active { transform: scale(0.96); }

        /* Biometric Button */
        .btn-bio {
            background: rgba(10, 132, 255, 0.15); color: var(--ios-blue);
            border: 1px solid rgba(10, 132, 255, 0.3);
            margin-top: 15px; display: none; /* Hidden by default */
        }
        .btn-bio:hover { background: rgba(10, 132, 255, 0.25); }
        .finger-anim {
            width: 24px; height: 24px; border: 2px solid var(--ios-blue);
            border-radius: 50%; animation: ripple 1.5s infinite;
        }
        @keyframes ripple { 0%{transform:scale(0.8);opacity:1} 100%{transform:scale(1.5);opacity:0} }

        /* Helpers */
        .hidden { display: none !important; }
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%,90%{transform:translate3d(-1px,0,0)} 20%,80%{transform:translate3d(2px,0,0)} 30%,50%,70%{transform:translate3d(-4px,0,0)} 40%,60%{transform:translate3d(4px,0,0)} }

        /* Notification */
        .toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(30,30,30,0.9); backdrop-filter: blur(10px);
            padding: 12px 24px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 10px; z-index: 100;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .toast.show { opacity: 1; top: 40px; }

        /* Recovery Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center; z-index: 200;
            backdrop-filter: blur(20px);
        }
        .modal-box {
            width: 85%; max-width: 320px; background: #1C1C1E;
            padding: 30px; border-radius: 26px; text-align: center;
        }
        .bio-icon-large { font-size: 4rem; color: var(--ios-blue); margin-bottom: 20px; }

    </style>
</head>
<body>

    <!-- Stars Background -->
    <canvas id="star-canvas"></canvas>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color:var(--ios-green)"></i>
        <span id="toast-msg">تمت العملية بنجاح</span>
    </div>

    <!-- Login Card -->
    <div class="login-container" id="card">
        
        <div class="lock-icon"><i class="fa-brands fa-apple"></i></div>
        <h1 class="title">Titan Security</h1>
        <p class="subtitle" id="sub-text">المصادقة الأمنية مطلوبة</p>

        <!-- PASSWORD FORM (Default) -->
        <div id="password-form">
            <div class="input-wrapper">
                <input type="text" id="username" class="ios-input" placeholder="اسم المستخدم" autocomplete="off">
                <i class="fa-solid fa-user-astronaut input-icon"></i>
            </div>
            <div class="input-wrapper">
                <input type="password" id="password" class="ios-input" placeholder="كلمة المرور">
                <i class="fa-solid fa-key input-icon"></i>
            </div>
            <button class="btn btn-primary" onclick="attemptLogin()">
                دخول آمن
            </button>
        </div>

        <!-- BIOMETRIC BUTTON (Shown if registered) -->
        <button class="btn btn-bio" id="bio-login-btn" onclick="verifyBiometric()">
            <i class="fa-solid fa-fingerprint"></i> دخول بالبصمة
        </button>

        <div style="margin-top:20px; font-size:0.85rem; color:var(--text-secondary); cursor:pointer" onclick="alert('اتصل بالمشرف للحصول على كود الاستعادة')">
            هل نسيت كلمة المرور؟
        </div>

    </div>

    <!-- Biometric Setup Modal -->
    <div class="modal-overlay" id="bio-modal">
        <div class="modal-box">
            <i class="fa-solid fa-fingerprint bio-icon-large"></i>
            <h2 style="font-size:1.4rem; margin-bottom:10px">تفعيل البصمة؟</h2>
            <p style="color:#aaa; font-size:0.9rem; margin-bottom:25px">
                يمكنك استخدام FaceID أو TouchID للدخول في المرة القادمة دون كتابة كلمة المرور.
            </p>
            <button class="btn btn-primary" style="background:var(--ios-blue); color:#fff; margin-bottom:10px" onclick="registerBiometric()">
                تفعيل الآن
            </button>
            <button class="btn" style="background:transparent; color:#888" onclick="skipBiometric()">
                ليس الآن
            </button>
        </div>
    </div>

    <script>
        /* 
           ==============================================================
           TITAN SECURITY CORE V5.0
           FEATURES: WEBAUTHN SIMULATION, 3D PARALLAX, LOCAL STORAGE MOCK
           ==============================================================
        */

        // 1. STAR ENGINE
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth, height = window.innerHeight;
        canvas.width = width; canvas.height = height;
        
        const stars = Array(150).fill().map(() => ({
            x: Math.random() * width, y: Math.random() * height,
            r: Math.random() * 1.5, s: Math.random() * 0.5
        }));

        function drawStars() {
            ctx.clearRect(0,0,width,height);
            ctx.fillStyle = "#FFF";
            stars.forEach(st => {
                ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
                st.y -= st.s; if(st.y < 0) st.y = height;
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // 2. 3D TILT EFFECT
        document.addEventListener('mousemove', (e) => {
            const card = document.getElementById('card');
            const x = (window.innerWidth / 2 - e.pageX) / 25;
            const y = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

        // 3. SECURITY LOGIC & BIOMETRICS
        
        // Check if user already registered fingerprint
        const hasBio = localStorage.getItem('titan_bio_registered') === 'true';

        window.onload = () => {
            if(hasBio) {
                // If registered, show Biometric Button immediately
                // document.getElementById('password-form').classList.add('hidden'); // Optional: hide pass form
                document.getElementById('bio-login-btn').style.display = 'flex';
                document.getElementById('sub-text').innerText = "تم التعرف على الجهاز";
                // Auto prompt
                // verifyBiometric(); // Uncomment to auto-trigger on load
            }
        };

        function showToast(msg, type='success') {
            const t = document.getElementById('toast');
            const icon = t.querySelector('i');
            icon.className = type==='error' ? "fa-solid fa-triangle-exclamation" : "fa-solid fa-circle-check";
            icon.style.color = type==='error' ? "var(--ios-red)" : "var(--ios-green)";
            document.getElementById('toast-msg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function shakeCard() {
            const c = document.getElementById('card');
            c.classList.remove('shake');
            void c.offsetWidth; // trigger reflow
            c.classList.add('shake');
            // Vibrate phone
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        // --- LOGIN FLOW ---

        function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // MOCK VALIDATION (Replace with Server Request)
            if(user.toLowerCase() === 'admin' && pass === 'admin123') { // Example Creds
                if(!hasBio) {
                    // First time? Ask for Biometric
                    document.getElementById('bio-modal').style.display = 'flex';
                } else {
                    // Already has bio but used password? Login success
                    loginSuccess();
                }
            } else {
                shakeCard();
                showToast("بيانات الدخول خاطئة", "error");
            }
        }

        function loginSuccess() {
            showToast("تم الدخول بنجاح");
            setTimeout(() => {
                // Redirect to Dashboard
                window.location.href = '/dashboard'; 
            }, 1000);
        }

        // --- WEBAUTHN IMPLEMENTATION (Real Browser API) ---

        // 1. REGISTER NEW FINGERPRINT
        async function registerBiometric() {
            if (!window.PublicKeyCredential) {
                alert("جهازك لا يدعم البصمة أو المتصفح قديم.");
                skipBiometric();
                return;
            }

            try {
                // Challenge generation (Normally from server)
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                const publicKey = {
                    challenge: challenge,
                    rp: { name: "Titan OS Security" },
                    user: {
                        id: Uint8Array.from("USER_ID_12345", c => c.charCodeAt(0)),
                        name: "admin@titan.os",
                        displayName: "Titan Admin"
                    },
                    pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                    authenticatorSelection: { authenticatorAttachment: "platform" },
                    timeout: 60000,
                    attestation: "direct"
                };

                showToast("ضع إصبعك على المستشعر...", "info");
                
                // THE REAL CALL
                const credential = await navigator.credentials.create({ publicKey });
                
                // If success:
                localStorage.setItem('titan_bio_registered', 'true');
                document.getElementById('bio-modal').style.display = 'none';
                showToast("تم تفعيل البصمة بنجاح!");
                setTimeout(loginSuccess, 1000);

            } catch (e) {
                console.error(e);
                showToast("فشل تسجيل البصمة", "error");
            }
        }

        // 2. VERIFY FINGERPRINT (LOGIN)
        async function verifyBiometric() {
            try {
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                const publicKey = {
                    challenge: challenge,
                    timeout: 60000,
                    userVerification: "required"
                };

                showToast("جاري التحقق من البصمة...", "info");

                // THE REAL CALL
                const assertion = await navigator.credentials.get({ publicKey });

                // If success (Browser returns object)
                loginSuccess();

            } catch (e) {
                console.error(e);
                shakeCard();
                showToast("لم تتطابق البصمة", "error");
            }
        }

        function skipBiometric() {
            document.getElementById('bio-modal').style.display = 'none';
            loginSuccess();
        }

    </script>
</body>
</html>
