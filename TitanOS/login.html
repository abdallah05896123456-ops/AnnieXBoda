<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan OS • Secure Biometric Entry</title>
    <meta name="theme-color" content="#000000">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=SF+Pro+Display:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. CORE DESIGN SYSTEM (Titan Dark Glass)
           ========================================================================== */
        :root {
            --bg-deep: #000000;
            --glass-surface: rgba(22, 22, 24, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #0A84FF;
            --accent-glow: rgba(10, 132, 255, 0.5);
            --error-red: #FF453A;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(235, 235, 245, 0.6);
            --blur: 40px;
            --radius: 32px;
            --anim-curve: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-deep);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Cairo", sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-primary);
        }

        /* Starfield Background */
        #star-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* ==========================================================================
           2. LOGIN FRAME (iPhone Style)
           ========================================================================== */
        .login-stage {
            position: relative; z-index: 10;
            width: 100%; max-width: 380px;
            perspective: 1000px;
        }

        .titan-card {
            background: var(--glass-surface);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            padding: 45px 30px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        /* Dynamic Header */
        .icon-header {
            font-size: 3.5rem; margin-bottom: 20px;
            background: linear-gradient(180deg, #fff, #666);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(255,255,255,0.15));
        }

        .welcome-text { font-size: 1.6rem; font-weight: 700; margin-bottom: 5px; letter-spacing: -0.5px; }
        .sub-text { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 35px; text-align: center; line-height: 1.5; }

        /* Inputs */
        .field-wrap { width: 100%; position: relative; margin-bottom: 16px; transition: 0.3s; }
        
        .ios-input {
            width: 100%; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 18px 20px; padding-left: 50px;
            color: #fff; font-size: 1rem; transition: all 0.3s var(--anim-curve);
        }
        .ios-input:focus {
            background: rgba(0,0,0,0.6); border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15); transform: scale(1.02);
        }
        .input-icon {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.3); pointer-events: none; transition: 0.3s;
        }
        .ios-input:focus + .input-icon { color: var(--accent-blue); }

        /* Buttons */
        .action-btn {
            width: 100%; padding: 18px; border-radius: 16px; border: none;
            background: var(--text-primary); color: #000; font-weight: 700; font-size: 1.1rem;
            cursor: pointer; margin-top: 10px; transition: all 0.3s var(--anim-curve);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,255,255,0.15); }
        .action-btn:active { transform: scale(0.96); }

        .biometric-btn {
            background: rgba(10, 132, 255, 0.15); color: var(--accent-blue);
            border: 1px solid rgba(10, 132, 255, 0.3);
        }
        .biometric-btn:hover { background: rgba(10, 132, 255, 0.25); box-shadow: 0 0 30px rgba(10, 132, 255, 0.3); }

        /* Views handling */
        .view-container { width: 100%; display: none; animation: fadeIn 0.5s var(--anim-curve); }
        .view-container.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
        .shake-anim { animation: shake 0.4s ease-in-out; border-color: var(--error-red) !important; color: var(--error-red) !important; }

        /* Fingerprint Animation */
        .scan-container {
            position: relative; width: 80px; height: 80px; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .scan-ring {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid var(--accent-blue); opacity: 0;
            animation: ripple 2s infinite;
        }
        .scan-ring:nth-child(2) { animation-delay: 0.5s; }
        @keyframes ripple { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        .msg-toast {
            position: fixed; bottom: 30px; background: rgba(20,20,20,0.9);
            border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 24px;
            border-radius: 30px; backdrop-filter: blur(10px); display: none; z-index: 100;
        }

    </style>
</head>
<body>

    <canvas id="star-canvas"></canvas>

    <div class="login-stage" id="mainStage">
        <div class="titan-card">
            
            <i class="fa-brands fa-apple icon-header"></i>
            
            <!-- VIEW 1: PASSWORD LOGIN (Initial) -->
            <div id="view-password" class="view-container active">
                <h1 class="welcome-text" style="text-align:center">تسجيل الدخول</h1>
                <p class="sub-text">أدخل كلمة المرور للمتابعة</p>
                
                <form onsubmit="event.preventDefault(); handlePasswordLogin();">
                    <div class="field-wrap">
                        <input type="text" id="username" class="ios-input" placeholder="اسم المستخدم" autocomplete="username">
                        <i class="fa-solid fa-user input-icon"></i>
                    </div>
                    <div class="field-wrap">
                        <input type="password" id="password" class="ios-input" placeholder="كلمة المرور" autocomplete="current-password">
                        <i class="fa-solid fa-key input-icon"></i>
                    </div>
                    <button type="submit" class="action-btn">
                        متابعة <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </form>
                
                <div style="margin-top:20px; text-align:center;">
                    <a href="#" style="color:var(--text-secondary); font-size:0.85rem; text-decoration:none">هل نسيت كلمة السر؟</a>
                </div>
            </div>

            <!-- VIEW 2: BIOMETRIC PROMPT (Returning User) -->
            <div id="view-biometric" class="view-container">
                <h1 class="welcome-text" style="text-align:center">أهلاً بك مجدداً</h1>
                <p class="sub-text">مطلوب المصادقة الحيوية للدخول</p>

                <div class="scan-container">
                    <div class="scan-ring"></div>
                    <div class="scan-ring"></div>
                    <i class="fa-solid fa-fingerprint" style="font-size:3.5rem; color:var(--accent-blue); z-index:2"></i>
                </div>

                <button class="action-btn biometric-btn" onclick="triggerWebAuthn()">
                    <i class="fa-solid fa-face-viewfinder"></i> التحقق بالبصمة
                </button>
                
                <button onclick="switchView('password')" style="background:transparent; border:none; color:var(--text-secondary); margin-top:20px; cursor:pointer; width:100%">
                    استخدام كلمة المرور
                </button>
            </div>

            <!-- VIEW 3: ENROLLMENT (Setup) -->
            <div id="view-enroll" class="view-container">
                <h1 class="welcome-text" style="text-align:center">تأمين الحساب</h1>
                <p class="sub-text">هل تريد تفعيل البصمة للدخول السريع مستقبلاً؟</p>
                <div style="text-align:center; font-size:3rem; margin-bottom:20px; color:var(--accent-blue)">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <button class="action-btn biometric-btn" onclick="enrollBiometric()">
                    نعم، تفعيل البصمة
                </button>
                <button class="action-btn" style="background:transparent; color:#fff; border:1px solid rgba(255,255,255,0.1); margin-top:10px" onclick="finishLogin()">
                    لا، تخطي الآن
                </button>
            </div>

        </div>
    </div>

    <div class="msg-toast" id="toast"></div>

    <script>
        /* 
           TITAN OS BIOMETRIC KERNEL
           Uses WebAuthn API for REAL browser authentication.
        */

        // --- 1. SETUP & UTILS ---
        const MOCK_USER = "TitanAdmin";
        const MOCK_PASS = "admin123"; // Password for first time login
        let enrolled = localStorage.getItem('titan_bio_enrolled') === 'true';

        // Background Stars
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [];
        
        function initStars() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<100; i++) stars.push({x: Math.random()*width, y: Math.random()*height, r: Math.random()*2, a: Math.random()});
        }
        function draw() {
            ctx.clearRect(0,0,width,height);
            ctx.fillStyle="#fff";
            stars.forEach(s=>{
                ctx.globalAlpha = s.a; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
                s.a += (Math.random()-0.5)*0.05; if(s.a<0) s.a=0; if(s.a>1) s.a=1;
            });
            requestAnimationFrame(draw);
        }
        window.onresize=initStars; initStars(); draw();

        // --- 2. LOGIC FLOW ---
        
        // On Load: Check if user is enrolled. If yes, ask for bio immediately.
        window.onload = () => {
            if(enrolled) {
                switchView('biometric');
                // Auto trigger scan after slight delay for UX
                setTimeout(triggerWebAuthn, 500);
            }
        };

        function switchView(id) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
            document.getElementById('view-'+id).classList.add('active');
        }

        function showToast(msg, isError=false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            t.style.borderColor = isError ? 'var(--error-red)' : 'var(--accent-blue)';
            setTimeout(()=>t.style.display='none', 3000);
        }

        // --- 3. PASSWORD HANDLER ---
        function handlePasswordLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            // Simple validation (In production, verify with server)
            if(u && p === MOCK_PASS) {
                if(!enrolled) {
                    switchView('enroll'); // Ask to enroll
                } else {
                    finishLogin();
                }
            } else {
                // Shake Animation
                const ins = document.querySelectorAll('.ios-input');
                ins.forEach(i => i.classList.add('shake-anim'));
                setTimeout(()=>ins.forEach(i=>i.classList.remove('shake-anim')), 500);
                showToast("بيانات الدخول غير صحيحة", true);
            }
        }

        // --- 4. WEBAUTHN (REAL BIOMETRICS) ---
        
        // Helper to convert strings/buffers
        const strToBuf = (str) => Uint8Array.from(str, c => c.charCodeAt(0));
        const bufToB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

        // A. REGISTRATION (Enroll)
        async function enrollBiometric() {
            if (!window.PublicKeyCredential) {
                showToast("جهازك لا يدعم البصمة", true);
                finishLogin();
                return;
            }

            // Options for creating a credential
            const publicKey = {
                challenge: crypto.getRandomValues(new Uint8Array(32)), // Random challenge
                rp: { name: "Titan OS Secure", id: window.location.hostname },
                user: {
                    id: strToBuf(MOCK_USER),
                    name: MOCK_USER,
                    displayName: "Titan Administrator"
                },
                pubKeyCredParams: [{alg: -7, type: "public-key"}, {alg: -257, type: "public-key"}],
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                timeout: 60000,
                attestation: "direct"
            };

            try {
                showToast("ضع اصبعك على المستشعر...");
                const credential = await navigator.credentials.create({ publicKey });
                
                // Success! Save flag locally (In production, send credential to server)
                localStorage.setItem('titan_bio_enrolled', 'true');
                enrolled = true;
                
                showToast("تم تفعيل البصمة بنجاح!");
                setTimeout(finishLogin, 1000);

            } catch (err) {
                console.error(err);
                showToast("فشل تفعيل البصمة أو تم الإلغاء", true);
                // Fallback to finishing login anyway since password was correct
                setTimeout(finishLogin, 1500);
            }
        }

        // B. AUTHENTICATION (Login with Bio)
        async function triggerWebAuthn() {
            if (!window.PublicKeyCredential) return;

            const publicKey = {
                challenge: crypto.getRandomValues(new Uint8Array(32)),
                allowCredentials: [], // Allow any registered for this RP (or fetch IDs from localStorage if needed)
                timeout: 60000,
                userVerification: "required"
            };

            try {
                const assertion = await navigator.credentials.get({ publicKey });
                // Success!
                finishLogin();
            } catch (err) {
                console.error(err);
                showToast("لم يتم التعرف على البصمة", true);
            }
        }

        // --- 5. FINISH ---
        function finishLogin() {
            showToast("تم الدخول بنجاح. مرحباً أيها القائد");
            document.querySelector('.titan-card').style.transform = "scale(0.9) translateY(-100vh)";
            document.querySelector('.titan-card').style.opacity = "0";
            
            // Redirect or Post to backend
            setTimeout(() => {
                // Here you would normally do: window.location.href = '/dashboard';
                // For this demo, we just reload to show the "Biometric Prompt" again
                if(!enrolled) location.reload(); 
                else {
                    // Simulate dashboard entry
                    document.body.innerHTML = '<h1 style="color:white;font-family:sans-serif">Titan OS Access Granted</h1>';
                }
            }, 800);
        }

        // Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth/2 - e.pageX) / 30;
            const y = (window.innerHeight/2 - e.pageY) / 30;
            document.querySelector('.titan-card').style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

    </script>
</body>
</html>
