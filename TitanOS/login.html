<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Titan OS | Premium Access</title>
    
    <!-- Fonts: Cairo for Arabic, SF Pro Display Alternative -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* 
        =====================================================
           1. تعريف المتغيرات (iOS Space System Variables)
        =====================================================
        */
        :root {
            /* iOS Colors */
            --ios-blue: #007AFF;
            --ios-blue-grad: linear-gradient(135deg, #007AFF, #00C7BE);
            --ios-dark: #000000;
            --ios-gray: #1C1C1E;
            --ios-light: #FFFFFF;
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            
            /* Glassmorphism */
            --glass-bg: rgba(30, 30, 35, 0.60);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shine: rgba(255, 255, 255, 0.05);
            
            /* Shadows & Glows */
            --shadow-card: 0 40px 80px rgba(0, 0, 0, 0.7);
            --shadow-input: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            --neon-glow: 0 0 20px rgba(0, 122, 255, 0.4);
            
            /* Text */
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            
            /* Metrics */
            --radius-xl: 40px;
            --radius-md: 18px;
            --anim-speed: 0.4s;
        }

        /* 
        =====================================================
           2. التأسيس (Reset & Layout)
        =====================================================
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Cairo', -apple-system, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* لمنع السكرول */
        }

        body {
            background-color: var(--ios-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 
        =====================================================
           3. الخلفية التفاعلية (Particle Canvas)
        =====================================================
        */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #1a1b2e 0%, #000000 90%);
        }

        /* 
        =====================================================
           4. شاشة التحميل (Preloader)
        =====================================================
        */
        #preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
        }

        .loader-orbit {
            width: 60px; height: 60px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            position: relative;
            animation: spin 2s linear infinite;
        }

        .loader-orbit::after {
            content: '';
            position: absolute;
            top: -5px; left: 50%;
            width: 10px; height: 10px;
            background: var(--ios-blue);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--ios-blue);
            transform: translateX(-50%);
        }

        .loader-text {
            margin-top: 20px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            opacity: 0.7;
            animation: pulse 1.5s infinite;
        }

        /* 
        =====================================================
           5. حاوية الكارت (3D Wrapper)
        =====================================================
        */
        .scene-3d {
            perspective: 1200px;
            z-index: 10;
            width: 90%;
            max-width: 440px;
            display: flex;
            justify-content: center;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(50px) saturate(180%);
            -webkit-backdrop-filter: blur(50px) saturate(180%);
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border);
            padding: 50px 40px;
            width: 100%;
            box-shadow: var(--shadow-card);
            transform-style: preserve-3d;
            transform: rotateX(0) rotateY(0);
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: floatUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.5s;
        }

        /* اللمعة العلوية (Highlight) */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        }

        /* اللمعة الخلفية المائلة */
        .glass-panel::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 45%, rgba(255,255,255,0) 50%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        /* 
        =====================================================
           6. المحتوى الداخلي (Inner Content)
        =====================================================
        */
        
        /* 6.1 صورة اللوجو (Round Space Planet) */
        .planet-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            position: relative;
            border-radius: 50%;
            transform: translateZ(40px); /* يبرز للخارج */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .planet-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 2;
        }

        /* الحلقات الدوارة حول الكوكب */
        .orbit-ring {
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--ios-blue);
            border-left-color: rgba(255,255,255,0.2);
            animation: spin 6s linear infinite;
            z-index: 1;
        }

        .orbit-ring:nth-child(2) {
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            border-top-color: transparent;
            border-bottom-color: #bf5af2; /* Purple */
            animation: spin 8s linear infinite reverse;
            opacity: 0.6;
        }

        /* 6.2 النصوص */
        .header-content {
            text-align: center;
            margin-bottom: 40px;
            transform: translateZ(30px);
        }

        .header-content h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #81b0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
        }

        .header-content p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 6.3 رسالة الخطأ (Jinja2) */
        .error-alert {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: var(--ios-red);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transform: translateZ(25px);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* 6.4 الحقول */
        .form-group {
            position: relative;
            margin-bottom: 20px;
            transform: translateZ(20px);
        }

        .ios-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            padding-right: 50px; /* مسافة للأيقونة */
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-align: left; /* المحتوى إنجليزي */
            direction: ltr;
        }

        .ios-input::placeholder {
            color: rgba(255,255,255,0.25);
            text-align: right;
        }

        .ios-input:focus {
            background: rgba(0, 0, 0, 0.45);
            border-color: var(--ios-blue);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
            transform: translateY(-2px);
        }

        .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: 0.3s;
            pointer-events: none;
        }

        .ios-input:focus + .input-icon {
            color: var(--ios-blue);
        }

        /* زر العين (Show Password) */
        .toggle-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px;
            transition: 0.3s;
        }
        .toggle-btn:hover { color: #fff; }

        /* شريط قوة الباسورد */
        .strength-track {
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: -10px 10px 25px 10px;
            overflow: hidden;
            transform: translateZ(15px);
        }
        .strength-fill {
            height: 100%; width: 0;
            background: var(--ios-red);
            transition: width 0.4s ease, background 0.4s ease;
        }

        /* 6.5 زر الدخول */
        .btn-ios {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--ios-blue-grad);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.25);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            transform: translateZ(30px);
        }

        .btn-ios:hover {
            transform: translateZ(35px) translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 122, 255, 0.4);
        }

        .btn-ios:active {
            transform: translateZ(25px) scale(0.98);
        }

        /* 6.6 الفوتر */
        .card-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
            transform: translateZ(10px);
        }

        /* 
        =====================================================
           7. الأنيميشن (Keyframes)
        =====================================================
        */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes floatUp { from { opacity: 0; transform: translateY(50px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
        
        .shake-trigger { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: var(--ios-red) !important; }

        /* 
        =====================================================
           8. تحسينات الموبايل (Responsive)
        =====================================================
        */
        @media (max-width: 480px) {
            .scene-3d { perspective: none; width: 95%; }
            .glass-panel { 
                transform: none !important; /* إلغاء الـ 3D للحفاظ على البطارية */
                padding: 40px 25px;
                border-radius: 30px;
            }
            .header-content h1 { font-size: 1.8rem; }
        }

    </style>
</head>
<body>

    <!-- 1. شاشة التحميل -->
    <div id="preloader">
        <div class="loader-orbit"></div>
        <div class="loader-text">INITIALIZING TITAN OS...</div>
    </div>

    <!-- 2. الخلفية الشبكية (Network Particles) -->
    <canvas id="particle-canvas"></canvas>

    <!-- 3. حاوية الكارت -->
    <div class="scene-3d" id="tilt-wrapper">
        <div class="glass-panel">
            
            <!-- صورة الكوكب -->
            <div class="planet-wrapper">
                <div class="orbit-ring"></div>
                <div class="orbit-ring"></div>
                <!-- صورة واقعية للفضاء (Unsplash) -->
                <img src="https://images.unsplash.com/photo-1614730341194-75c60740a2d3?q=80&w=250&auto=format&fit=crop" alt="Planet" class="planet-img">
            </div>

            <!-- النصوص -->
            <div class="header-content">
                <h1>Titan OS <span style="font-size:0.5em; vertical-align: super; color: var(--ios-blue);">PRO</span></h1>
                <p>نظام التحكم المركزي المتطور</p>
            </div>

            <!-- عرض الخطأ (Python Jinja2) -->
            {% if error %}
            <div class="error-alert">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- الفورم -->
            <form id="loginForm" action="/login" method="POST" onsubmit="return validateForm(event)">
                
                <!-- اسم المستخدم -->
                <div class="form-group">
                    <input type="text" name="username" id="username" class="ios-input" placeholder="Admin ID" required autocomplete="off">
                    <i class="fa-solid fa-user-astronaut input-icon"></i>
                </div>

                <!-- كلمة المرور -->
                <div class="form-group">
                    <input type="password" name="password" id="password" class="ios-input" placeholder="Passcode" required>
                    <i class="fa-solid fa-fingerprint input-icon"></i>
                    <!-- زر إظهار الباسورد -->
                    <i class="fa-solid fa-eye toggle-btn" onclick="togglePass()"></i>
                </div>
                
                <!-- شريط القوة -->
                <div class="strength-track">
                    <div class="strength-fill" id="strength-bar"></div>
                </div>

                <!-- زر الدخول -->
                <button type="submit" class="btn-ios" id="submit-btn">
                    تسجيل الدخول
                </button>

                <!-- الفوتر -->
                <div class="card-footer">
                    Secure Connection &bull; Version 4.0.1
                </div>

            </form>
        </div>
    </div>

    <!-- 
    =====================================================
       9. الجافاسكريبت (The Brain)
    =====================================================
    -->
    <script>
        // --- 1. إخفاء اللودر ---
        window.addEventListener('load', () => {
            const loader = document.getElementById('preloader');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.visibility = 'hidden', 800);
            }, 1000);
        });

        // --- 2. نظام الشبكة (Particle Network) ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.size = Math.random() * 2 + 1;
                // لون أزرق سماوي خافت
                this.color = `rgba(0, 190, 255, ${Math.random() * 0.5 + 0.2})`; 
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // تكوين الجزيئات
        function initParticles() {
            particles = [];
            const count = Math.min(window.innerWidth / 15, 80); // عدد مناسب للموبايل
            for(let i=0; i<count; i++) particles.push(new Particle());
        }

        // رسم الخطوط بين النقاط القريبة
        function drawLines() {
            for(let i=0; i<particles.length; i++) {
                for(let j=i+1; j<particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if(dist < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 122, 255, ${1 - dist/150})`; // خط أزرق شفاف
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            drawLines();
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();

        // تفاعل الماوس مع الشبكة
        document.addEventListener('mousemove', (e) => {
            particles.forEach(p => {
                const dx = e.clientX - p.x;
                const dy = e.clientY - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 150) {
                    p.vx += dx * 0.0005;
                    p.vy += dy * 0.0005;
                }
            });
        });

        // --- 3. تأثير الـ 3D Tilt (للكومبيوتر فقط) ---
        const wrapper = document.getElementById('tilt-wrapper');
        const card = document.querySelector('.glass-panel');

        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return; // تعطيل على الموبايل
            
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // --- 4. منطق الفورم ---
        
        // أ) إظهار الباسورد
        function togglePass() {
            const pass = document.getElementById('password');
            const btn = document.querySelector('.toggle-btn');
            if(pass.type === 'password') {
                pass.type = 'text';
                btn.classList.replace('fa-eye', 'fa-eye-slash');
                btn.style.color = 'var(--ios-blue)';
            } else {
                pass.type = 'password';
                btn.classList.replace('fa-eye-slash', 'fa-eye');
                btn.style.color = '';
            }
        }

        // ب) قياس القوة
        const passIn = document.getElementById('password');
        const bar = document.getElementById('strength-bar');

        passIn.addEventListener('keyup', (e) => {
            const v = e.target.value;
            let s = 0;
            if(v.length > 3) s++;
            if(v.length > 7) s++;
            if(/[0-9]/.test(v)) s++;
            if(/[^A-Za-z0-9]/.test(v)) s++;

            if(v.length === 0) bar.style.width = '0%';
            else if(s < 2) { bar.style.width = '30%'; bar.style.background = '#FF3B30'; }
            else if(s < 4) { bar.style.width = '60%'; bar.style.background = '#FFD60A'; }
            else { bar.style.width = '100%'; bar.style.background = '#34C759'; }
        });

        // ج) التحقق والإرسال
        function validateForm(e) {
            const user = document.getElementById('username');
            const pass = document.getElementById('password');
            const btn = document.getElementById('submit-btn');

            let valid = true;
            if(!user.value) { user.classList.add('shake-trigger'); valid = false; }
            if(!pass.value) { pass.classList.add('shake-trigger'); valid = false; }

            setTimeout(() => {
                user.classList.remove('shake-trigger');
                pass.classList.remove('shake-trigger');
            }, 500);

            if(!valid) {
                e.preventDefault();
                return false;
            }

            // محاكاة الاتصال بالسيرفر
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري الاتصال...';
            btn.style.opacity = '0.8';
            return true;
        }

    </script>
</body>
</html>
